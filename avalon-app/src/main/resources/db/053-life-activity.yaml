databaseChangeLog:
  - changeSet:
      id: 053-life-activity
      author: avalon
      changes:
        - addColumn:
            tableName: player_character
            columns:
              - column:
                  name: active_life_session
                  type: varchar(36)
                  remarks: 当前在线采集或钓鱼会话，结束前禁止移动与开战
              - column:
                  name: dispatched_creature_id
                  type: bigint
                  remarks: 当前派遣的伙伴编号，钓鱼会话为空
        - sql:
            sql: ALTER TABLE player_character ADD CONSTRAINT life_dispatch_requires_session CHECK (dispatched_creature_id IS NULL OR active_life_session IS NOT NULL)
