# 单体同步 JDBC，虚拟线程处理请求，禁止在响应序列化阶段隐式读取数据库。
spring:
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  application:
    name: avalon
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
  liquibase:
    change-log: classpath:db/changelog.yaml
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health
# Starter 管理雪花生成器；手工机器号由部署方保证各实例唯一。
cosid:
  enabled: true
  namespace: avalon
  machine:
    enabled: true
    distributor:
      type: manual
    # 手动分配没有远程租约，不启动续租巡检。
    guarder:
      enabled: false
  snowflake:
    enabled: true
    share:
      # 与原生成器一致：运行期时钟回拨时立即拒绝发号。
      clock-sync: false

# 战斗记录仅保存文本；生产容器挂载该目录，活动战斗不受结束记录保留期限影响。
avalon:
  battle:
    logs:
      directory: logs/battles
      retention-days: 30
