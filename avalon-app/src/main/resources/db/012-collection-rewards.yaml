databaseChangeLog:
  - changeSet:
      id: 012-collection-rewards
      author: avalon
      dbms: postgresql
      comment: 不在迁移脚本发放奖励，旧档通过受锁命令按真实历史补领，保持内容取自 YAML。
      changes:
        - createTable:
            tableName: collection_receipt
            remarks: "账号级一次性图鉴结算；保存实际发放值，不因后来调整目录而改写历史收益。"
            columns:
              - column:
                  name: id
                  remarks: "CosId 分配的雪花主键；仅用于稳定标识记录，不承载业务顺序。"
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: account_id
                  remarks: "所属账号主键；凭证按账号隔离，不能由客户端越权指定。"
                  type: bigint
                  constraints:
                    nullable: false
                    referencedTableName: account
                    referencedColumnNames: id
                    foreignKeyName: collection_receipt_account_id_fkey
              - column:
                  name: code
                  remarks: "账号级图鉴奖励的稳定编号；同账号同编号只结算一次。"
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: gold
                  remarks: "本次实际发放的金币数量；保存历史值，不随后续奖励配置调整。"
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: item_code
                  remarks: "本次奖励物品编号；无物品奖励时允许为空。"
                  type: varchar(255)
              - column:
                  name: quantity
                  remarks: "本次实际发放的物品数量；没有物品奖励时为零。"
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  remarks: "首次成功创建时间，使用服务端时间保存；重试不覆盖。"
                  type: timestamptz
                  constraints:
                    nullable: false
        - sql:
            dbms: postgresql
            sql: ALTER TABLE collection_receipt ADD CONSTRAINT collection_receipt_gold_check CHECK (gold >= 0);
        - sql:
            dbms: postgresql
            sql: ALTER TABLE collection_receipt ADD CONSTRAINT collection_receipt_quantity_check CHECK (quantity
              >= 0);
        - addUniqueConstraint:
            tableName: collection_receipt
            columnNames: account_id,code
            constraintName: collection_receipt_account_id_code_key
