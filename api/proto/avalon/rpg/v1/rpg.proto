// RPG 世界地图、移动和遭遇的唯一管理端/玩家端契约。
syntax = "proto3";

package avalon.rpg.v1;

option go_package = "github.com/lishangbu/avalon/api/gen/go/avalon/rpg/v1;rpgv1";

import "avalon/security/v1/access.proto";
import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

// RpgWorldService 提供已认证玩家可见的 RPG 世界查询和原子命令。
service RpgWorldService {
  // GetMap 返回按发现事实裁剪的地图子图。
  rpc GetMap(GetMapRequest) returns (GetMapResponse) { option (avalon.security.v1.access) = {}; }
  // Traverse 成功移动并在同一事务中处理发现和遭遇抽样。
  rpc Traverse(TraverseRequest) returns (TraverseResponse) { option (avalon.security.v1.access) = {}; }
  // GetPendingEncounter 返回最近一条仍可处理的待遭遇。
  rpc GetPendingEncounter(GetPendingEncounterRequest) returns (GetPendingEncounterResponse) { option (avalon.security.v1.access) = {}; }
  // ResolvePendingEncounter 接受或取消已抽样遭遇。
  rpc ResolvePendingEncounter(ResolvePendingEncounterRequest) returns (ResolvePendingEncounterResponse) { option (avalon.security.v1.access) = {}; }
  // GetCheckpoint 返回当前角色的恢复点。
  rpc GetCheckpoint(GetCheckpointRequest) returns (GetCheckpointResponse) { option (avalon.security.v1.access) = {}; }
  // SetCheckpoint 在服务端规则允许时更新恢复点。
  rpc SetCheckpoint(SetCheckpointRequest) returns (SetCheckpointResponse) { option (avalon.security.v1.access) = {}; }
  // GetParty 返回用于世界遭遇的有序 Party。
  rpc GetParty(GetPartyRequest) returns (GetPartyResponse) { option (avalon.security.v1.access) = {}; }
  // ReplaceParty 以期望版本幂等替换 Party 成员顺序。
  rpc ReplaceParty(ReplacePartyRequest) returns (ReplacePartyResponse) { option (avalon.security.v1.access) = {}; }
  // GetInventory 返回活动角色的聚合背包与 Owned Creature 携带物诊断视图。
  rpc GetInventory(GetInventoryRequest) returns (GetInventoryResponse) { option (avalon.security.v1.access) = {}; }
  // ReplaceHeldItem 原子替换或卸下一个 Owned Creature 的 Held Item。
  rpc ReplaceHeldItem(ReplaceHeldItemRequest) returns (ReplaceHeldItemResponse) { option (avalon.security.v1.access) = {}; }
  // ListEquipmentInstances 分页读取活动角色拥有的可穿装备实例。
  rpc ListEquipmentInstances(ListEquipmentInstancesRequest) returns (ListEquipmentInstancesResponse) { option (avalon.security.v1.access) = {}; }
  // GetEquipmentLoadout 返回活动角色当前完整装备槽位状态。
  rpc GetEquipmentLoadout(GetEquipmentLoadoutRequest) returns (GetEquipmentLoadoutResponse) { option (avalon.security.v1.access) = {}; }
  // GetEquipmentInstance 返回活动角色拥有的一个装备实例详情。
  rpc GetEquipmentInstance(GetEquipmentInstanceRequest) returns (GetEquipmentInstanceResponse) { option (avalon.security.v1.access) = {}; }
  // ReplaceEquipmentLoadout 以单一期望版本原子替换整套装备槽位。
  rpc ReplaceEquipmentLoadout(ReplaceEquipmentLoadoutRequest) returns (ReplaceEquipmentLoadoutResponse) { option (avalon.security.v1.access) = {}; }
  // SellEquipmentInstance 出售一个未穿戴的装备实例。
  rpc SellEquipmentInstance(SellEquipmentInstanceRequest) returns (SellEquipmentInstanceResponse) { option (avalon.security.v1.access) = {}; }
  // PurchaseShopItem 从角色当前地点的启用商店购买普通道具或独立装备实例。
  rpc PurchaseShopItem(PurchaseShopItemRequest) returns (PurchaseShopItemResponse) { option (avalon.security.v1.access) = {}; }
  // ListAvailableQuests 返回当前地点和前置条件下可开始的任务定义。
  rpc ListAvailableQuests(ListAvailableQuestsRequest) returns (ListAvailableQuestsResponse) { option (avalon.security.v1.access) = {}; }
  // ListQuestProgress 返回活动角色的任务生命周期与目标进度。
  rpc ListQuestProgress(ListQuestProgressRequest) returns (ListQuestProgressResponse) { option (avalon.security.v1.access) = {}; }
  // StartQuest 原子开始首轮任务或已经领取上一轮奖励的可重复任务。
  rpc StartQuest(StartQuestRequest) returns (StartQuestResponse) { option (avalon.security.v1.access) = {}; }
  // CompleteQuest 在全部目标达成且当前交付地点正确时完成一轮任务。
  rpc CompleteQuest(CompleteQuestRequest) returns (CompleteQuestResponse) { option (avalon.security.v1.access) = {}; }
  // ClaimQuestRewards 领取一轮已完成且尚未领取的任务奖励。
  rpc ClaimQuestRewards(ClaimQuestRewardsRequest) returns (ClaimQuestRewardsResponse) { option (avalon.security.v1.access) = {}; }
  // ClaimLootSettlement 领取服务端已经结算、归属于当前角色的掉落事实。
  rpc ClaimLootSettlement(ClaimLootSettlementRequest) returns (ClaimLootSettlementResponse) { option (avalon.security.v1.access) = {}; }
  // GetActiveProfessions 返回当前参与装备资格判定的职业进度。
  rpc GetActiveProfessions(GetActiveProfessionsRequest) returns (GetActiveProfessionsResponse) { option (avalon.security.v1.access) = {}; }
  // ReplaceActiveProfessions 原子替换激活职业集合，并阻止当前装备变为非法。
  rpc ReplaceActiveProfessions(ReplaceActiveProfessionsRequest) returns (ReplaceActiveProfessionsResponse) { option (avalon.security.v1.access) = {}; }
}

// RpgWorldAdminService 提供完整地图拓扑、RPG 资料维护和完整性报告查询。
service RpgWorldAdminService {
  // ListRegions 分页读取 Region。
  rpc ListRegions(ListRegionsRequest) returns (ListRegionsResponse) { option (avalon.security.v1.access) = {}; }
  // CreateRegion 在维护窗口创建 Region。
  rpc CreateRegion(CreateRegionRequest) returns (CreateRegionResponse) { option (avalon.security.v1.access) = {}; }
  // UpdateRegion 使用乐观版本完整更新 Region。
  rpc UpdateRegion(UpdateRegionRequest) returns (UpdateRegionResponse) { option (avalon.security.v1.access) = {}; }
  // ListLocations 分页读取完整 Location 拓扑。
  rpc ListLocations(ListLocationsRequest) returns (ListLocationsResponse) { option (avalon.security.v1.access) = {}; }
  rpc CreateLocation(CreateLocationRequest) returns (CreateLocationResponse) { option (avalon.security.v1.access) = {}; }
  rpc UpdateLocation(UpdateLocationRequest) returns (UpdateLocationResponse) { option (avalon.security.v1.access) = {}; }
  // ListLocationExits 分页读取有向出口。
  rpc ListLocationExits(ListLocationExitsRequest) returns (ListLocationExitsResponse) { option (avalon.security.v1.access) = {}; }
  // CreateLocationExit 在维护窗口创建有向出口。
  rpc CreateLocationExit(CreateLocationExitRequest) returns (CreateLocationExitResponse) { option (avalon.security.v1.access) = {}; }
  // UpdateLocationExit 使用乐观版本完整更新有向出口。
  rpc UpdateLocationExit(UpdateLocationExitRequest) returns (UpdateLocationExitResponse) { option (avalon.security.v1.access) = {}; }
  rpc ListCheckpoints(ListCheckpointsRequest) returns (ListCheckpointsResponse) { option (avalon.security.v1.access) = {}; }
  rpc CreateCheckpoint(CreateCheckpointRequest) returns (CreateCheckpointResponse) { option (avalon.security.v1.access) = {}; }
  rpc UpdateCheckpoint(UpdateCheckpointRequest) returns (UpdateCheckpointResponse) { option (avalon.security.v1.access) = {}; }
  rpc ListEncounterTables(ListEncounterTablesRequest) returns (ListEncounterTablesResponse) { option (avalon.security.v1.access) = {}; }
  rpc CreateEncounterTable(CreateEncounterTableRequest) returns (CreateEncounterTableResponse) { option (avalon.security.v1.access) = {}; }
  rpc UpdateEncounterTable(UpdateEncounterTableRequest) returns (UpdateEncounterTableResponse) { option (avalon.security.v1.access) = {}; }
  rpc ListMapProjections(ListMapProjectionsRequest) returns (ListMapProjectionsResponse) { option (avalon.security.v1.access) = {}; }
  rpc CreateMapProjection(CreateMapProjectionRequest) returns (CreateMapProjectionResponse) { option (avalon.security.v1.access) = {}; }
  rpc UpdateMapProjection(UpdateMapProjectionRequest) returns (UpdateMapProjectionResponse) { option (avalon.security.v1.access) = {}; }
  rpc ListNpcs(ListNpcsRequest) returns (ListNpcsResponse) { option (avalon.security.v1.access) = {}; }
  rpc SaveNpc(SaveNpcRequest) returns (SaveNpcResponse) { option (avalon.security.v1.access) = {}; }
  rpc ListDialogues(ListDialoguesRequest) returns (ListDialoguesResponse) { option (avalon.security.v1.access) = {}; }
  rpc SaveDialogue(SaveDialogueRequest) returns (SaveDialogueResponse) { option (avalon.security.v1.access) = {}; }
  rpc ListLootTables(ListLootTablesRequest) returns (ListLootTablesResponse) { option (avalon.security.v1.access) = {}; }
  rpc SaveLootTable(SaveLootTableRequest) returns (SaveLootTableResponse) { option (avalon.security.v1.access) = {}; }
  rpc ListShops(ListShopsRequest) returns (ListShopsResponse) { option (avalon.security.v1.access) = {}; }
  rpc SaveShop(SaveShopRequest) returns (SaveShopResponse) { option (avalon.security.v1.access) = {}; }
  rpc ListQuests(ListQuestsRequest) returns (ListQuestsResponse) { option (avalon.security.v1.access) = {}; }
  rpc SaveQuest(SaveQuestRequest) returns (SaveQuestResponse) { option (avalon.security.v1.access) = {}; }
  rpc ListRecipes(ListRecipesRequest) returns (ListRecipesResponse) { option (avalon.security.v1.access) = {}; }
  rpc SaveRecipe(SaveRecipeRequest) returns (SaveRecipeResponse) { option (avalon.security.v1.access) = {}; }
  rpc ListProfessions(ListProfessionsRequest) returns (ListProfessionsResponse) { option (avalon.security.v1.access) = {}; }
  rpc SaveProfession(SaveProfessionRequest) returns (SaveProfessionResponse) { option (avalon.security.v1.access) = {}; }
  // ListEquipments 分页读取完整 Equipment Catalog Entry 聚合。
  rpc ListEquipments(ListEquipmentsRequest) returns (ListEquipmentsResponse) { option (avalon.security.v1.access) = {}; }
  // ListEquipmentOptions 返回管理表单可选择的全部启用装备轻量引用。
  rpc ListEquipmentOptions(ListEquipmentOptionsRequest) returns (ListEquipmentOptionsResponse) { option (avalon.security.v1.access) = {}; }
  // SaveEquipment 原子创建或替换装备主资料及其全部关系。
  rpc SaveEquipment(SaveEquipmentRequest) returns (SaveEquipmentResponse) { option (avalon.security.v1.access) = {}; }
  // ListAdminEquipmentInstances 分页诊断玩家装备实例和穿戴状态。
  rpc ListAdminEquipmentInstances(ListAdminEquipmentInstancesRequest) returns (ListAdminEquipmentInstancesResponse) { option (avalon.security.v1.access) = {}; }
  // ListEquipmentTransactions 分页读取不可变装备资产流水。
  rpc ListEquipmentTransactions(ListEquipmentTransactionsRequest) returns (ListEquipmentTransactionsResponse) { option (avalon.security.v1.access) = {}; }
  // GrantEquipment 向一个 PlayerCharacter 幂等授予一种启用装备。
  rpc GrantEquipment(GrantEquipmentRequest) returns (GrantEquipmentResponse) { option (avalon.security.v1.access) = {}; }
  // ListIntegrityReports 分页读取最近的拓扑校验报告。
  rpc ListIntegrityReports(ListIntegrityReportsRequest) returns (ListIntegrityReportsResponse) { option (avalon.security.v1.access) = {}; }
}

// GetMapRequest 指定玩家地图读取的资源版本和游标。
message GetMapRequest {
  string cursor = 1 [(buf.validate.field).string.max_len = 2048];
  int32 page_size = 2 [(buf.validate.field).int32 = {gte: 1, lte: 200}];
}

// GetMapResponse 返回发现子图和下一页不透明游标。
message GetMapResponse {
  repeated MapLocation locations = 1 [(google.api.field_behavior) = REQUIRED];
  repeated MapExit exits = 2 [(google.api.field_behavior) = REQUIRED];
  string next_cursor = 3;
  // position 是当前角色的权威位置和并发版本。
  Position position = 4 [(google.api.field_behavior) = REQUIRED];
}

// MapLocation 是玩家已发现的地点最小视图。
message MapLocation {
  string id = 1 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"];
  string region_id = 2 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"];
  string parent_id = 3 [(buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"];
  string code = 4 [(google.api.field_behavior) = REQUIRED];
  string name = 5 [(google.api.field_behavior) = REQUIRED];
  string location_type = 6 [(google.api.field_behavior) = REQUIRED];
  int32 map_x = 7;
  int32 map_y = 8;
  int32 map_z = 9;
}

// MapExit 是玩家已发现的有向出口最小视图。
message MapExit {
  string id = 1 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"];
  string source_location_id = 2 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"];
  string target_location_id = 3 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"];
  string code = 4 [(google.api.field_behavior) = REQUIRED];
  string name = 5 [(google.api.field_behavior) = REQUIRED];
  int32 sort_order = 6;
}

// TraverseRequest 是带幂等键和并发版本的移动命令。
message TraverseRequest {
  string exit_id = 1 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"];
  int64 expected_position_version = 2 [(buf.validate.field).int64.gt = 0];
  string idempotency_key = 3 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string = {min_len: 1, max_len: 128}];
}

// TraverseResponse 返回提交后位置和可选待遭遇。
message TraverseResponse {
  Position position = 1 [(google.api.field_behavior) = REQUIRED];
  PendingEncounter pending_encounter = 2;
}

// Position 是角色当前地图位置的并发视图。
message Position {
  string location_id = 1 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"];
  int64 move_sequence = 2 [(buf.validate.field).int64.gte = 0];
  int64 version = 3 [(buf.validate.field).int64.gt = 0];
  google.protobuf.Timestamp updated_at = 4 [(google.api.field_behavior) = REQUIRED];
}

// GetPendingEncounterRequest 读取当前角色待处理遭遇。
message GetPendingEncounterRequest {}
// GetPendingEncounterResponse 返回待处理遭遇或空值。
message GetPendingEncounterResponse { PendingEncounter pending_encounter = 1; }

// PendingEncounter 是已经抽样且不可重抽的遭遇。
message PendingEncounter {
  string id = 1 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"];
  string encounter_entry_id = 2 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"];
  string state = 3 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.Timestamp expires_at = 4 [(google.api.field_behavior) = REQUIRED];
  optional string battle_id = 5 [(buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"];
}

// ResolvePendingEncounterRequest 接受或取消遭遇。
message ResolvePendingEncounterRequest {
  string pending_encounter_id = 1 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"];
  PendingEncounterResolution resolution = 2 [(google.api.field_behavior) = REQUIRED];
  string idempotency_key = 3 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string = {min_len: 1, max_len: 128}];
}

// PendingEncounterResolution 是遭遇唯一允许的终态操作。
enum PendingEncounterResolution {
  PENDING_ENCOUNTER_RESOLUTION_UNSPECIFIED = 0;
  PENDING_ENCOUNTER_RESOLUTION_ACCEPT = 1;
  PENDING_ENCOUNTER_RESOLUTION_CANCEL = 2;
}

// ResolvePendingEncounterResponse 返回遭遇终态。
message ResolvePendingEncounterResponse { PendingEncounter pending_encounter = 1 [(google.api.field_behavior) = REQUIRED]; }

// GetCheckpointRequest 读取当前角色恢复点。
message GetCheckpointRequest {}
// GetCheckpointResponse 返回恢复点。
message GetCheckpointResponse { Checkpoint checkpoint = 1; }
// Checkpoint 是可恢复地点的最小玩家视图。
message Checkpoint { string id = 1 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"]; string location_id = 2 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"]; string code = 3 [(google.api.field_behavior) = REQUIRED]; string name = 4 [(google.api.field_behavior) = REQUIRED]; }

// SetCheckpointRequest 更新当前角色恢复点。
message SetCheckpointRequest { string checkpoint_id = 1 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"]; int64 expected_version = 2 [(buf.validate.field).int64.gt = 0]; string idempotency_key = 3 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string = {min_len: 1, max_len: 128}]; }
// SetCheckpointResponse 返回更新后的恢复点版本。
message SetCheckpointResponse { Checkpoint checkpoint = 1 [(google.api.field_behavior) = REQUIRED]; int64 version = 2 [(buf.validate.field).int64.gt = 0]; }

// GetPartyRequest 读取当前 Party。
message GetPartyRequest {}
// GetPartyResponse 返回当前 Party。
message GetPartyResponse { Party party = 1 [(google.api.field_behavior) = REQUIRED]; }
// Party 是最多六只 Owned Creature 的有序编组。
message Party { string id = 1 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"]; int64 version = 2 [(buf.validate.field).int64.gt = 0]; repeated PartyMember members = 3 [(google.api.field_behavior) = REQUIRED]; }
// PartyMember 是 Party 中从一开始的固定位置。
message PartyMember { int32 position = 1 [(buf.validate.field).int32 = {gte: 1, lte: 6}]; string player_character_creature_id = 2 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"]; }
// ReplacePartyRequest 替换 Party 成员。
message ReplacePartyRequest { repeated PartyMember members = 1 [(google.api.field_behavior) = REQUIRED]; int64 expected_version = 2 [(buf.validate.field).int64.gt = 0]; string idempotency_key = 3 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string = {min_len: 1, max_len: 128}]; }
// ReplacePartyResponse 返回新的 Party。
message ReplacePartyResponse { Party party = 1 [(google.api.field_behavior) = REQUIRED]; }

// GetInventoryRequest 读取当前活动角色的完整非零背包和 Owned Creature 携带物。
message GetInventoryRequest {}

// GetInventoryResponse 返回背包数量与 Owned Creature 当前携带事实。
message GetInventoryResponse {
  // items 只包含数量大于零的聚合 Inventory Stack，并按道具稳定 Identifier 排序。
  repeated InventoryItem items = 1 [(google.api.field_behavior) = REQUIRED];
  // owned_creatures 返回角色拥有的 Creature 及其可选 Held Item。
  repeated OwnedCreatureHeldItem owned_creatures = 2 [(google.api.field_behavior) = REQUIRED];
}

// InventoryItem 是一种道具在活动角色背包中的当前聚合数量。
message InventoryItem {
  // item_id 是 Item Catalog Entry 的不透明 Snowflake Identifier。
  string item_id = 1 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"];
  // item_name 是当前实时资料中的简体中文名称。
  string item_name = 2 [(google.api.field_behavior) = REQUIRED];
  // usage_type 是当前实时资料中的闭集道具用途。
  string usage_type = 3 [(google.api.field_behavior) = REQUIRED];
  // quantity 是提交后严格为正的背包数量。
  int64 quantity = 4 [(buf.validate.field).int64.gt = 0];
  // version 是该 Inventory Stack 的乐观并发版本。
  int64 version = 5 [(buf.validate.field).int64.gt = 0];
}

// OwnedCreatureHeldItem 是一个 Owned Creature 当前携带物的安全读取视图。
message OwnedCreatureHeldItem {
  // player_character_creature_id 是玩家实际拥有的 Creature 实例 Identifier。
  string player_character_creature_id = 1 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"];
  // creature_id 是该实例引用的实时 Creature 资料 Identifier。
  string creature_id = 2 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"];
  // nickname 是玩家设置的可选昵称；空值表示未设置。
  optional string nickname = 3;
  // held_item_id 是当前携带道具 Identifier；空值表示未携带。
  optional string held_item_id = 4 [(buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"];
  // held_item_name 是当前携带道具名称；未携带时为空值。
  optional string held_item_name = 5;
  // version 是 ReplaceHeldItem 必须提交的 Owned Creature 乐观版本。
  int64 version = 6 [(buf.validate.field).int64.gt = 0];
}

// ReplaceHeldItemRequest 原子替换或卸下一个 Owned Creature 的 Held Item。
message ReplaceHeldItemRequest {
  // player_character_creature_id 指定活动角色拥有的 Creature 实例。
  string player_character_creature_id = 1 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"];
  // item_id 指定待携带道具；缺省表示卸下当前 Held Item。
  optional string item_id = 2 [(buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"];
  // expected_creature_version 防止覆盖并发发生的成长或携带物变化。
  int64 expected_creature_version = 3 [(buf.validate.field).int64.gt = 0];
  // idempotency_key 使网络重试只提交一次背包和携带物变化。
  string idempotency_key = 4 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string = {min_len: 1, max_len: 128}];
}

// ReplaceHeldItemResponse 返回提交后的 Owned Creature 携带事实。
message ReplaceHeldItemResponse {
  OwnedCreatureHeldItem owned_creature = 1 [(google.api.field_behavior) = REQUIRED];
}

// EquipmentInstance 是玩家可理解的一件独立装备资产及其资料摘要。
message EquipmentInstance {
  string id = 1 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"];
  string equipment_id = 2 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"];
  string item_id = 3 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"];
  string name = 4 [(google.api.field_behavior) = REQUIRED];
  string slot_type = 5 [(google.api.field_behavior) = REQUIRED];
  optional string handedness = 6;
  string source_type = 7 [(google.api.field_behavior) = REQUIRED];
  int64 version = 8 [(buf.validate.field).int64.gt = 0];
  google.protobuf.Timestamp acquired_at = 9 [(google.api.field_behavior) = REQUIRED];
  optional string equipped_slot = 10;
  int32 minimum_level = 11 [(buf.validate.field).int32.gt = 0];
  repeated string rule_timings = 12 [(google.api.field_behavior) = REQUIRED];
}
