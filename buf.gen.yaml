version: v2

clean: true

plugins:
  - local:
      - go
      - tool
      - protoc-gen-go
    out: api/gen/go
    opt:
      - paths=source_relative
  - local:
      - go
      - tool
      - protoc-gen-go-grpc
    out: api/gen/go
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
  - local:
      - go
      - tool
      - protoc-gen-connect-go
    out: api/gen/go
    opt:
      - paths=source_relative
      - simple
