// GameElementEffectiveness 是攻击属性面对单个防御属性时的非中性规范倍率。
//
// 实际倍率按 numerator / denominator 计算；未返回的属性组合按 1 / 1 处理。多防御属性
// 分别查询并相乘，因此本消息始终只描述一个攻击属性与一个防御属性的方向关系。
message GameElementEffectiveness {
  // id 是属性克制关系的稳定 Snowflake Identifier。
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  // attack_element_id 是发起攻击的属性稳定 Snowflake Identifier。
  string attack_element_id = 2 [(google.api.field_behavior) = REQUIRED];
  // defense_element_id 是承受攻击的单个属性稳定 Snowflake Identifier。
  string defense_element_id = 3 [(google.api.field_behavior) = REQUIRED];
  // numerator 是规范倍率分子；与 denominator 组成 2/1、1/2 或 0/1。
  int32 numerator = 4 [(google.api.field_behavior) = REQUIRED];
  // denominator 是规范倍率分母，始终大于零；实际倍率等于 numerator / denominator。
  int32 denominator = 5 [(google.api.field_behavior) = REQUIRED];
  // enabled 表示该关系是否参与实时资料读取和规则快照冻结。
  bool enabled = 6 [(google.api.field_behavior) = REQUIRED];
  // version 是乐观并发控制版本。
  string version = 7 [(google.api.field_behavior) = REQUIRED];
}

