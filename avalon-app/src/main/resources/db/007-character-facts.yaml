databaseChangeLog:
  - changeSet:
      id: 007-character-facts
      author: avalon
      dbms: postgresql
      comment: 只记录已经发生的事实。唯一约束与角色锁共同防止同一事实重复写入。 既有任务回执本身就是完成证据。复用其全局唯一雪花值，不重新发奖励。
      changes:
        - createTable:
            tableName: character_fact
            remarks: "角色已发生的游戏事实。只由实际完成对应行为的应用命令写入，客户端不能直接声明事实。"
            columns:
              - column:
                  name: id
                  remarks: "雪花主键，内部保持 Long，序列化时避免 JavaScript 精度丢失。"
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: character_id
                  remarks: "所属角色；不通过跨模块实体关联传播持久化状态。"
                  type: bigint
                  constraints:
                    nullable: false
                    referencedTableName: player_character
                    referencedColumnNames: id
                    foreignKeyName: character_fact_character_id_fkey
              - column:
                  name: code
                  remarks: "稳定事实编号，例如在特定教学阶段完成恢复；显示文本不参与判定。"
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  remarks: "首次实际发生时间；重复操作保留原时间，不覆盖已经取得的资格。"
                  type: timestamptz
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: character_fact
            columnNames: character_id,code
            constraintName: character_fact_character_id_code_key
        - sql:
            dbms: postgresql
            sql: 'INSERT INTO character_fact (id, character_id, code, created_at)

              SELECT id, character_id, ''QUEST:'' || step, created_at FROM quest_receipt;'
