databaseChangeLog:
  - changeSet:
      id: 026-creature-provenance
      author: avalon
      dbms: postgresql
      comment: 原始获得身份独立于当前归属；未知旧来源保守绑定，不伪造捕获者。
      changes:
        - addColumn:
            tableName: owned_creature
            columns:
              - column:
                  name: origin_character_id
                  remarks: "首次获得者不随交易变更，用于保持来源防重。未知外部旧档允许为空，不猜测身份。"
                  type: bigint
                  constraints:
                    referencedTableName: player_character
                    referencedColumnNames: id
                    foreignKeyName: creature_origin_character_fkey
              - column:
                  name: captor_character_id
                  remarks: "仅亲自捕获才保存捕获者；任务赠宠没有捕获者，不能把当前持有者冒充捕获者。"
                  type: bigint
                  constraints:
                    referencedTableName: player_character
                    referencedColumnNames: id
                    foreignKeyName: creature_captor_character_fkey
              - column:
                  name: origin_kind
                  remarks: "初始来源类别在创建时固定；进化、交易不覆盖原始来源。"
                  type: varchar(16)
                  defaultValue: UNKNOWN
                  constraints:
                    nullable: false
              - column:
                  name: bound
                  remarks: "未知来源默认绑定；捕获入口明确设为未绑定，后续绑定材料只允许将其改为绑定。"
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: custom_name
                  remarks: "显式记录是否自定义过昵称，进化不能凭名称与默认名相等就误覆盖玩家昵称。"
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - sql:
            dbms: postgresql
            sql: |
              UPDATE owned_creature SET origin_character_id = character_id, custom_name = rename_count > 0;
              UPDATE owned_creature c SET origin_kind = 'CAPTURE', captor_character_id = c.character_id, bound = false
              FROM battle b WHERE b.character_id = c.character_id
                AND c.source LIKE ((b.state::jsonb ->> 'encounter') || ':' || b.id::text || ':%');
              ALTER TABLE owned_creature ADD CONSTRAINT creature_origin_kind_check
                CHECK (origin_kind IN ('UNKNOWN', 'GIFT', 'CAPTURE'));
        - createIndex:
            tableName: owned_creature
            indexName: creature_origin_source
            unique: true
            columns:
              - column:
                  name: origin_character_id
              - column:
                  name: source
