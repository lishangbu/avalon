databaseChangeLog:
  - changeSet:
      id: 014-legacy-inventory
      author: avalon
      dbms: postgresql
      comment: 只登记升级时已经存在的角色。实际堆叠与任务栏规则由库存领域执行，避免 SQL 再实现一套容量算法。
      changes:
        - createTable:
            tableName: inventory_reconciliation
            remarks: "旧背包容量修复队列；完成修复后删除，不在普通查询时修改库存。"
            columns:
              - column:
                  name: character_id
                  remarks: "待执行旧背包容量修复的角色主键；同一角色只排队一次。"
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
                    referencedTableName: player_character
                    referencedColumnNames: id
                    foreignKeyName: inventory_reconciliation_character_id_fkey
        - sql:
            dbms: postgresql
            sql: INSERT INTO inventory_reconciliation (character_id) SELECT DISTINCT character_id FROM owned_item;
