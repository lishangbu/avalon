databaseChangeLog:
  - changeSet:
      id: 029-creature-level-storage
      author: avalon
      dbms: postgresql
      comment: 第二阶段个体存储支持至30级；不修改人物经验、正式升级上限或野外生成范围。
      changes:
        - sql:
            sql: ALTER TABLE owned_creature DROP CONSTRAINT owned_creature_level_check;
        - sql:
            sql: ALTER TABLE owned_creature ADD CONSTRAINT owned_creature_level_check CHECK (level BETWEEN 1 AND 30);
