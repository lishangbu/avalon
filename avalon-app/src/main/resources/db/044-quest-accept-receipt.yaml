databaseChangeLog:
  - changeSet:
      id: 044-quest-accept-receipt
      author: avalon
      changes:
        - createTable:
            tableName: quest_accept_receipt
            remarks: 任务显式接取回执，补给与接取事实同事务，独立于完成奖励
            columns:
              - column:
                  name: id
                  type: bigint
                  remarks: CosId雪花主键
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: character_id
                  type: bigint
                  remarks: 接取任务的角色归属
                  constraints:
                    nullable: false
                    referencedTableName: player_character
                    referencedColumnNames: id
                    foreignKeyName: fk_quest_accept_character
              - column:
                  name: request_id
                  type: varchar(36)
                  remarks: 同一角色内唯一标准UUID请求号
                  constraints:
                    nullable: false
              - column:
                  name: step
                  type: varchar(255)
                  remarks: 接取的稳定任务步骤编号
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: text
                  remarks: 原步骤与位置版本，重复请求需完全一致
                  constraints:
                    nullable: false
              - column:
                  name: accepted_at
                  type: timestamp with time zone
                  remarks: 第一次接取时刻，同任务后续请求沿用，供捕获时间核验
                  constraints:
                    nullable: false
              - column:
                  name: response
                  type: text
                  remarks: 首次响应原文，包含原补给说明或已接取提示
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: quest_accept_receipt
            columnNames: character_id, request_id
            constraintName: uq_quest_accept_character_request
        - createIndex:
            tableName: quest_accept_receipt
            indexName: ix_quest_accept_character_step
            columns:
              - column:
                  name: character_id
              - column:
                  name: step
              - column:
                  name: id
