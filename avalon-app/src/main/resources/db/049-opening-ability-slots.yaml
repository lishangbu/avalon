              UPDATE owned_creature p SET ability=m.ability FROM opening_ability_mapping m
              WHERE p.species=m.species AND p.ability_slot=m.slot;
              DELETE FROM creature_discovery d USING creature_discovery other, opening_ability_mapping m
              WHERE d.species=m.species AND d.ability_slot=m.slot AND other.species=d.species
              AND other.ability_slot=d.ability_slot AND other.character_id=d.character_id AND other.id<d.id;
              UPDATE creature_discovery p SET ability=m.ability FROM opening_ability_mapping m
              WHERE p.species=m.species AND p.ability_slot=m.slot;
