  // required_weathers 是允许触发的普通天气稳定代码集合；空集合表示不限制天气。
  repeated string required_weathers = 2 [(google.api.field_behavior) = REQUIRED];
}
// GameEndTurnRandomStatStageChange 描述随机提升与降低两个不同能力的规则。
message GameEndTurnRandomStatStageChange {
  // raise_delta 是随机提升项使用的正变化量。
  int32 raise_delta = 1 [(google.api.field_behavior) = REQUIRED];
  // lower_delta 是另一随机降低项使用的负变化量。
  int32 lower_delta = 2 [(google.api.field_behavior) = REQUIRED];
}
// GameFaintStatStageBoost 描述倒下事件触发的能力提升。
message GameFaintStatStageBoost {
  // stat 是被提升能力的稳定代码。
  string stat = 1 [(google.api.field_behavior) = REQUIRED];
  // delta 是本次声明的正变化量。
  int32 delta = 2 [(google.api.field_behavior) = REQUIRED];
  // requires_caused_faint 表示只有持有者亲自造成倒下时才触发。
  bool requires_caused_faint = 3 [(google.api.field_behavior) = REQUIRED];
}
// GameFaintAttackerDamage 描述持有者倒下后的攻击者反制伤害。
message GameFaintAttackerDamage {
  // requires_contact 表示原技能必须仍构成有效接触。
  bool requires_contact = 1 [(google.api.field_behavior) = REQUIRED];
  // attacker_max_hp_denominator 是按攻击者最大生命计算时使用的分母；0 表示不采用该算法。
  int32 attacker_max_hp_denominator = 2 [(google.api.field_behavior) = REQUIRED];
  // uses_damage_taken 表示改用持有者本次实际损失生命作为反制伤害。
  bool uses_damage_taken = 3 [(google.api.field_behavior) = REQUIRED];
  // suppressed_by_explosion_suppression 表示本规则可被场上爆炸效果封锁特性阻止。
  bool suppressed_by_explosion_suppression = 4 [(google.api.field_behavior) = REQUIRED];
}
// GameReceivedDamageStatStageChange 描述承受本体伤害后的能力变化。
message GameReceivedDamageStatStageChange {
  // changes 是按声明顺序执行的能力阶级变化集合。
  repeated GameStatStageDelta changes = 1 [(google.api.field_behavior) = REQUIRED];
  // requires_contact 表示本次技能必须仍构成有效接触。
  bool requires_contact = 2 [(google.api.field_behavior) = REQUIRED];
  // changes_attacker 表示把变化施加给攻击者而不是特性持有者。
  bool changes_attacker = 3 [(google.api.field_behavior) = REQUIRED];
  // element_ids 是允许触发的技能有效属性稳定 Snowflake Identifier 集合；空集合表示不限制属性。
  repeated string element_ids = 4 [(google.api.field_behavior) = REQUIRED];
}
// GameReceivedDamageCharge 描述受伤后储存的一次性属性伤害倍率。
message GameReceivedDamageCharge {
  // element_id 是下一次攻击必须匹配的有效属性稳定 Snowflake Identifier。
  string element_id = 1 [(google.api.field_behavior) = REQUIRED];
  // numerator 是伤害倍率的正分子。
  int32 numerator = 2 [(google.api.field_behavior) = REQUIRED];
  // denominator 是伤害倍率的正分母。
  int32 denominator = 3 [(google.api.field_behavior) = REQUIRED];
}

// GameReactiveAbilityRules 汇集回合末、受伤和倒下窗口使用的强类型特性规则。
message GameReactiveAbilityRules {
  // end_turn_stat_stage_changes 是每回合末固定施加给持有者的能力变化。
  repeated GameStatStageDelta end_turn_stat_stage_changes = 1 [(google.api.field_behavior) = REQUIRED];
  // major_status_end_turn_healing 是以异常原始伤害替换为回复的规则。
  GameMajorStatusEndTurnHealing major_status_end_turn_healing = 2;
  // weather_end_turn_damage 是匹配天气下对持有者造成伤害的规则。
  GameWeatherEndTurnDamage weather_end_turn_damage = 3;
  // opponent_major_status_end_turn_damage 是对匹配异常的上场对手造成伤害的规则。
  GameOpponentMajorStatusEndTurnDamage opponent_major_status_end_turn_damage = 4;
  // end_turn_major_status_cure 是回合末治愈自身主要异常的规则。
  GameEndTurnMajorStatusCure end_turn_major_status_cure = 5;
  // end_turn_ally_major_status_cure_chance 是治愈一名上场伙伴主要异常的百分比概率；0 表示没有规则。
  int32 end_turn_ally_major_status_cure_chance = 6 [(google.api.field_behavior) = REQUIRED];
  // end_turn_random_stat_stage_change 是随机选择不同能力项升降的规则。
  GameEndTurnRandomStatStageChange end_turn_random_stat_stage_change = 7;
  // once_per_battle_caused_faint_multi_stat_boost 是持有者首次造成倒下时同时提升的能力集合。
  repeated GameStatStageDelta once_per_battle_caused_faint_multi_stat_boost = 8 [(google.api.field_behavior) = REQUIRED];
  // faint_stat_stage_boosts 是倒下事件触发的能力提升集合。
  repeated GameFaintStatStageBoost faint_stat_stage_boosts = 9 [(google.api.field_behavior) = REQUIRED];
  // faint_highest_stat_boost 表示持有者造成倒下后提升五项原始能力中最高的一项。
  bool faint_highest_stat_boost = 10 [(google.api.field_behavior) = REQUIRED];
  // faint_attacker_damage 是持有者因技能伤害倒下后的攻击者反制规则。
  GameFaintAttackerDamage faint_attacker_damage = 11;
  // explosion_effect_suppression 表示该成员存活在场时封锁声明可被封锁的倒下反制。
  bool explosion_effect_suppression = 12 [(google.api.field_behavior) = REQUIRED];
  // critical_damage_set_stat_stage 是持有者承受要害本体伤害后直接设置的能力阶级。
  GameStatStageDelta critical_damage_set_stat_stage = 13;
  // damage_crossed_half_hp_stat_stage_changes 是生命首次跨至半血或以下时执行的能力变化集合。
  repeated GameStatStageDelta damage_crossed_half_hp_stat_stage_changes = 14 [(google.api.field_behavior) = REQUIRED];
  // received_damage_stat_stage_changes 是承受真实本体技能伤害后按顺序执行的能力规则。
  repeated GameReceivedDamageStatStageChange received_damage_stat_stage_changes = 15 [(google.api.field_behavior) = REQUIRED];
  // received_damage_charge 是受伤后储存下一次属性攻击强化的规则。
  GameReceivedDamageCharge received_damage_charge = 16;
  // received_damage_attacker_major_status 是持有者承受真实本体技能伤害后施加给攻击者的主要异常稳定代码；空值表示没有规则。
  string received_damage_attacker_major_status = 17 [(google.api.field_behavior) = REQUIRED];
}

// GameAbilityEnvironmentHighestStatMultiplier 是特性按普通环境强化成员最高原始能力的独立资料。
//
// required_weather 与 required_terrain 必须且只能设置一个。枚举的 UNSPECIFIED 值表示没有设置，不得作为
// 可执行环境；最高能力项与倍率由 Battle Engine 按固定规则计算，不能通过管理 API 自由指定。
message GameAbilityEnvironmentHighestStatMultiplier {
  GameSkillWeatherKind required_weather = 1;
  GameSkillTerrainKind required_terrain = 2;
}

// GameAbilityOpponentSwitchRestriction 是特性限制敌方成员主动换人的独立资料。
//
// 消息本身的存在表示规则启用，因此三个字段均为零值时仍合法地表示限制所有对手。它不影响倒下补位或技能、
// 道具触发的强制换人；这些生命周期由 Battle Engine 使用独立规则处理。
message GameAbilityOpponentSwitchRestriction {
  // required_target_element_id 是受限制目标必须拥有的可选当前属性稳定 Snowflake Identifier；空值表示不按属性筛选。
  string required_target_element_id = 1 [(buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"];
  // requires_grounded_target 表示只有当前接地的目标会受限制。
  bool requires_grounded_target = 2 [(google.api.field_behavior) = REQUIRED];
  // same_effect_grants_immunity 表示目标具有同类限制规则时，可免疫本规则。
  bool same_effect_grants_immunity = 3 [(google.api.field_behavior) = REQUIRED];
}

// GameAbilitySwitchInFormChange 是特性持有成员进入场地时一次性切换形态的独立资料。
//
// 两个字段均为 Creature Data Projection 的稳定 Snowflake Identifier。能力、属性、体重与最大生命不由 API 传入，而由 Battle 用成员
// 培养值和等级从目标形态资料计算后冻结，避免运行态数值同管理资料混用。
message GameAbilitySwitchInFormChange {
  // base_creature_id 是允许触发本规则的基础形态稳定 Snowflake Identifier。
  string base_creature_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"
  ];
  // alternate_creature_id 是触发后切换到的目标形态稳定 Snowflake Identifier。
  string alternate_creature_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"
  ];
  // adds_maximum_hp_difference 表示目标最大生命更高时是否补齐两种形态的正差额。
  bool adds_maximum_hp_difference = 3 [(google.api.field_behavior) = REQUIRED];
}

// GameAbilitySwitchOutFormChange 是特性持有成员成功离场时触发的确定形态切换资料。
//
// 两个字段均为 Creature Data Projection 的稳定 Snowflake Identifier。目标画像在 Battle 启动时冻结，运行期不查询游戏资料；倒下后的
// 补位不是成功离场，因而不会触发该规则。
message GameAbilitySwitchOutFormChange {
  // base_creature_id 是允许触发本规则的当前基础形态稳定 Snowflake Identifier。
  string base_creature_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"
  ];
  // alternate_creature_id 是成功离场后切换到的目标形态稳定 Snowflake Identifier。
  string alternate_creature_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"
  ];
}

// GameAbilityWeatherFormTarget 是一种普通天气与目标形态的独立绑定。
message GameAbilityWeatherFormTarget {
  // weather 是会选择此目标形态的封闭普通天气，不能为 UNSPECIFIED。
  GameSkillWeatherKind weather = 1 [(google.api.field_behavior) = REQUIRED];
  // creature_id 是匹配天气时切换到的目标形态稳定 Snowflake Identifier。
  string creature_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"
  ];
}

// GameAbilityWeatherFormChange 是特性持有成员按有效普通天气同步形态的独立资料。
//
// 无天气、未映射天气和天气效果被封锁时均会使用 default_creature_id。每种天气至多一个目标，不能依赖数组
// 顺序决定运行时优先级。
message GameAbilityWeatherFormChange {
  // default_creature_id 是未命中天气映射时使用的默认形态稳定 Snowflake Identifier。
  string default_creature_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"
  ];
  // targets 是天气到目标形态的完整无重复映射。
  repeated GameAbilityWeatherFormTarget targets = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 4
    }
  ];
}

