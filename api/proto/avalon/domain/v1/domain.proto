message GameSkillOnUseRules {
  string ailment_id = 2;
  string category_id = 3;
  string target_id = 4;
  int32 min_hits = 5;
  int32 max_hits = 6;
  int32 min_turns = 7;
  int32 max_turns = 8;
  int32 drain = 9;
  int32 healing = 10;
  int32 crit_rate = 11;
  int32 ailment_chance = 12;
  int32 flinch_chance = 13;
  int32 stat_chance = 14;
  string damage_mode = 19 [(google.api.field_behavior) = REQUIRED];
  int32 damage_amount = 20;
  int32 damage_numerator = 21;
  int32 damage_denominator = 22;
  int32 minimum_damage = 23;
  // volatile_effects 是封闭枚举的易变状态规则数组，不接受展示文本或脚本。
  repeated GameSkillVolatileEffect volatile_effects = 24;
  // cures_user_side_major_statuses 表示成功后清除使用者同侧整支队伍（含后备成员）的主要异常状态。
  bool cures_user_side_major_statuses = 25;
  // cures_user_major_status 表示成功后仅清除使用者自身的主要异常状态。
  bool cures_user_major_status = 26;
  // cures_user_side_active_major_statuses 表示成功后仅清除使用者同侧当前上场成员的主要异常状态。
  bool cures_user_side_active_major_statuses = 27;
  // one_hit_knock_out_base_accuracy 是一击必杀的基础命中率；命中时会叠加双方等级差。
  int32 one_hit_knock_out_base_accuracy = 28;
  // one_hit_knock_out_same_element_user_base_accuracy 是同属性使用者替换基础命中率的可选例外。
  int32 one_hit_knock_out_same_element_user_base_accuracy = 29;
  // one_hit_knock_out_blocks_same_element_target 表示同属性目标会在命中掷骰前阻止一击必杀。
  bool one_hit_knock_out_blocks_same_element_target = 30;
  // received_damage_numerator 是伤害记忆反打倍率的正分子。
  int32 received_damage_numerator = 31;
  // received_damage_denominator 是伤害记忆反打倍率的正分母。
  int32 received_damage_denominator = 32;
  // received_damage_accepts_physical 表示伤害记忆是否接受物理伤害来源。
  bool received_damage_accepts_physical = 33;
  // received_damage_accepts_special 表示伤害记忆是否接受特殊伤害来源。
  bool received_damage_accepts_special = 34;
  // received_damage_ignore_non_immune_element_effectiveness 表示反打仅保留完全免疫判定。
  bool received_damage_ignore_non_immune_element_effectiveness = 35;
  // dynamic_power 是普通公式伤害在结算前使用的可选强类型动态基础威力规则。
  GameSkillDynamicPower dynamic_power = 36;
  // field_speed_order 是技能成功后尝试建立的可选全场速度顺序效果。
  GameSkillFieldSpeedOrder field_speed_order = 37;
  // leech_seed 是技能命中后尝试在已选目标种下的可选寄生种子规则。
  GameSkillLeechSeed leech_seed = 38;
  // weather 是技能成功后尝试建立的可选普通全场天气。
  GameSkillWeather weather = 39;
  // terrain 是技能成功后尝试建立的可选普通全场场地。
  GameSkillTerrain terrain = 40;
  // tailwind 是技能成功后尝试在使用者一方建立的可选顺风侧状态。
  GameSkillTailwind tailwind = 41;
  // reflect 是技能成功后尝试在使用者一方建立的可选反射壁侧状态。
  GameSkillReflect reflect = 42;
  // light_screen 是技能成功后尝试在使用者一方建立的可选光墙侧状态。
  GameSkillLightScreen light_screen = 43;
  // aurora_veil 是技能成功后尝试在使用者一方建立的可选极光幕侧状态。
  GameSkillAuroraVeil aurora_veil = 44;
  // spikes 是技能成功后尝试在被选中对手一方增加一层撒菱的可选入场危害。
  GameSkillSpikes spikes = 45;
  // stealth_rock 是技能成功后尝试在被选中对手一方布置隐形岩的可选入场危害。
  GameSkillStealthRock stealth_rock = 46;
  // toxic_spikes 是技能成功后尝试在被选中对手一方增加一层毒菱的可选入场危害。
  GameSkillToxicSpikes toxic_spikes = 47;
  // sticky_web 是技能成功后尝试在被选中对手一方布置黏黏网的可选入场危害。
  GameSkillStickyWeb sticky_web = 48;
  // rapid_spin 是成功造成伤害后清除使用者一方入场危害的可选固定后效。
  GameSkillRapidSpin rapid_spin = 49;
  // defog 是成功后清除目标方屏障、入场危害和普通场地的可选固定后效。
  GameSkillDefog defog = 50;
  // weakened_by_grassy_terrain 标记会被青草场地削弱的震动类地面技能。
  bool weakened_by_grassy_terrain = 51;
  // weather_accuracy_overrides 是指定普通天气下替换基础命中率的独立规则；0 表示必中。
  repeated GameSkillWeatherAccuracyOverride weather_accuracy_overrides = 52;
  // weather_element_overrides 是指定普通天气下替换基础属性的独立规则。
  repeated GameSkillWeatherElementOverride weather_element_overrides = 53;
  // weather_power_multipliers 是指定普通天气下调整普通伤害基础威力的独立分数规则。
  repeated GameSkillWeatherPowerMultiplier weather_power_multipliers = 54;
  // charge_skipped_weathers 是指定普通天气下跳过首次蓄力等待的独立规则集合。
  repeated GameSkillWeatherKind charge_skipped_weathers = 55;
  // force_target_switch 表示技能在目标完成普通伤害及其它目标后效后，尝试强制目标从健康后备中换入。
  // 替身、目标倒下或没有健康后备时不会发生替换；多个后备的选择由战斗随机轨迹固定。
  bool force_target_switch = 56;
  // recharges_after_use 表示技能成功扣除目标本体生命后，使用者下一次技能行动前必须休整。
  bool recharges_after_use = 57;

  // locks_accuracy_on_target 表示技能命中后使使用者在下一回合内锁定当前具体目标的命中。
  bool locks_accuracy_on_target = 58;
  // makes_contact 表示技能在没有后续动态规则改写时属于接触类技能。
  bool makes_contact = 59;

  // punch_based 表示技能是否属于拳击类技能，供拳击道具和特性读取。
  bool punch_based = 60;

  // powder_based 表示技能是否属于粉末或孢子类技能，供粉末免疫规则读取。
  bool powder_based = 61;
  // target_healing_numerator 是技能按目标最大生命值回复目标的正分子；必须与分母同时提供。
  int32 target_healing_numerator = 62;
  // target_healing_denominator 是技能按目标最大生命值回复目标的正分母；必须与分子同时提供。
  int32 target_healing_denominator = 63;
  // slicing_based 表示技能是否属于切割类技能。
  bool slicing_based = 64;
  // sound_based 表示技能是否属于声音类技能。
  bool sound_based = 65;
  // pulse_based 表示技能是否属于波动类技能，伤害和目标回复共享该标签。
  bool pulse_based = 66;
  // bite_based 表示技能是否属于啃咬类技能。
  bool bite_based = 67;
}

