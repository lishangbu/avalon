                  remarks: "触发器名称，与触发器组共同标识触发器。"
                  type: varchar(200)
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: trigger_group
                  remarks: "触发器分组名称。"
                  type: varchar(200)
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: blob_data
                  remarks: "序列化触发器数据。"
                  type: bytea
        - addForeignKeyConstraint:
            baseTableName: qrtz_blob_triggers
            baseColumnNames: sched_name,trigger_name,trigger_group
            referencedTableName: qrtz_triggers
            referencedColumnNames: sched_name,trigger_name,trigger_group
            constraintName: qrtz_blob_triggers_sched_name_trigger_name_trigger_group_fkey
        - createTable:
            tableName: qrtz_calendars
            remarks: "Quartz 调度日历；由调度框架管理，不作为游戏业务实体。"
            columns:
              - column:
                  name: sched_name
                  remarks: "调度器名称，用于隔离不同调度器的数据。"
