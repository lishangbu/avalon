// Avalon 领域 API 的 Protobuf-first 权威契约。
// Avalon 领域 API 的 Protobuf-first 权威契约，由源码直接维护。

syntax = "proto3";

package avalon.domain.v1;

import "avalon/security/v1/access.proto";
import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/lishangbu/avalon/api/gen/go/avalon/domain/v1";

message ActivePlayerCharacter {
  string player_character_id = 1 [(google.api.field_behavior) = REQUIRED];
  string version = 2 [(google.api.field_behavior) = REQUIRED];
  string updated_at = 3 [(google.api.field_behavior) = REQUIRED];
}

message ActiveTeam {
  string player_character_id = 1 [(google.api.field_behavior) = REQUIRED];
  string team_id = 2 [(google.api.field_behavior) = REQUIRED];
  string version = 3 [(google.api.field_behavior) = REQUIRED];
  string updated_at = 4 [(google.api.field_behavior) = REQUIRED];
}

message Asset {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  // Protobuf property "status".
  string status = 2 [(google.api.field_behavior) = REQUIRED];
  string media_type = 3 [(google.api.field_behavior) = REQUIRED];
  int64 expected_size = 4 [(google.api.field_behavior) = REQUIRED];
  string expected_sha256 = 5 [(google.api.field_behavior) = REQUIRED];
  int64 actual_size = 6 [(google.api.field_behavior) = REQUIRED];
  string actual_sha256 = 7 [(google.api.field_behavior) = REQUIRED];
  int32 width = 8 [(google.api.field_behavior) = REQUIRED];
  int32 height = 9 [(google.api.field_behavior) = REQUIRED];
  string version = 10 [(google.api.field_behavior) = REQUIRED];
  string created_at = 11 [(google.api.field_behavior) = REQUIRED];
  string ready_at = 12 [(google.api.field_behavior) = REQUIRED];
}

// AssetPage 是当前管理员账号拥有的 Asset 分页结果。
message AssetPage {
  // items 按创建时间和 Snowflake Identifier 倒序排列。
  repeated Asset items = 1 [(google.api.field_behavior) = REQUIRED];
  // page 是本次查询采用的页码。
  int32 page = 2 [(google.api.field_behavior) = REQUIRED];
  // page_size 是本次查询采用的每页记录数。
  int32 page_size = 3 [(google.api.field_behavior) = REQUIRED];
  // total 是筛选条件命中的总记录数。
  int64 total = 4 [(google.api.field_behavior) = REQUIRED];
}

// AssetReadLocation 返回 Ready Asset 不需要认证且不会由 Avalon 主动过期的公开地址。
message AssetReadLocation {
  // url 是不携带签名、临时凭据和查询参数的稳定对象读取地址。
  string url = 1 [(google.api.field_behavior) = REQUIRED];
  reserved 2;
}

message AssetUploadGrant {
  // Protobuf property "asset".
  Asset asset = 1 [(google.api.field_behavior) = REQUIRED];
  string method = 2 [(google.api.field_behavior) = REQUIRED];
  string url = 3 [(google.api.field_behavior) = REQUIRED];
  repeated SignedHeader headers = 4 [(google.api.field_behavior) = REQUIRED];
  string expires_at = 5 [(google.api.field_behavior) = REQUIRED];
}

message SignedHeader {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  string value = 2 [(google.api.field_behavior) = REQUIRED];
}

message BattleClauseEffectDefinition {
  string kind = 1 [(google.api.field_behavior) = REQUIRED];
  int32 schema_version = 2 [(google.api.field_behavior) = REQUIRED];
  // Protobuf property "parameters".
  EmptyEffectParameters parameters = 3 [(google.api.field_behavior) = REQUIRED];
}

message EmptyEffectParameters {
  // Scalar value wrapper.
  string value = 1;
}

message BattleDeadlines {
  int32 preview_seconds = 1 [(google.api.field_behavior) = REQUIRED];
  int32 turn_seconds = 2 [(google.api.field_behavior) = REQUIRED];
  int32 battle_seconds = 3 [(google.api.field_behavior) = REQUIRED];
}

message BattleFormatAvailability {
  bool challenge = 1 [(google.api.field_behavior) = REQUIRED];
  bool training = 2 [(google.api.field_behavior) = REQUIRED];
  bool admin_preview = 3 [(google.api.field_behavior) = REQUIRED];
  bool encounter = 4 [(google.api.field_behavior) = REQUIRED];
}

message BattleLevelRule {
  string mode = 1 [(google.api.field_behavior) = REQUIRED];
  optional int32 level = 2;
}

message BattleMechanicEffectDefinition {
  string kind = 1 [(google.api.field_behavior) = REQUIRED];
  int32 schema_version = 2 [(google.api.field_behavior) = REQUIRED];
  // Protobuf property "parameters"。level-normalization 必须提供正等级；terastallization 是无参数机制，
  // 该对象仍必须出现且 level 固定为 0，以保留管理端所有特殊机制的一致对象结构。
  LevelNormalizationParameters parameters = 3 [(google.api.field_behavior) = REQUIRED];
}

message LevelNormalizationParameters {
  int32 level = 1 [(google.api.field_behavior) = REQUIRED];
}

message BattleRestrictionEffectDefinition {
  string kind = 1 [(google.api.field_behavior) = REQUIRED];
  int32 schema_version = 2 [(google.api.field_behavior) = REQUIRED];
  // Protobuf property "parameters".
  StableCodeListParameters parameters = 3 [(google.api.field_behavior) = REQUIRED];
}

message StableCodeListParameters {
  string mode = 1 [(google.api.field_behavior) = REQUIRED];
  string resource_type = 2 [(google.api.field_behavior) = REQUIRED];
  repeated string stable_codes = 3 [(google.api.field_behavior) = REQUIRED];
}

message ConfirmAssetUploadBody {
  string expected_version = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.pattern = "^[1-9][0-9]*$"
  ];
}

message CreateAssetUploadBody {
  string media_type = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 127
    }
  ];
  int64 expected_size = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).int64 = {
      gt: 0
      lte: 52428800
    }
  ];
  string expected_sha256 = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.pattern = "^[A-Fa-f0-9]{64}$"
  ];
}

message GameAbilityRuleGroup {
  // 特性提供的普通天气回合末伤害免疫；不影响天气建立、命中、威力或属性替换。
  repeated GameSkillWeatherKind weather_damage_immunities = 6 [(google.api.field_behavior) = REQUIRED];
  // 特性是否在持有成员存活且上场时封锁普通天气的可执行效果。
  bool weather_effects_suppressed = 7 [(google.api.field_behavior) = REQUIRED];
  // 特性是否阻止持有成员被技能或道具强制换下；不影响主动换人或倒下补位。
  bool forced_switch_immunity = 32 [(google.api.field_behavior) = REQUIRED];
  // 特性是否在持有成员生命首次从高于二分之一降至二分之一或以下时强制其换下。
  bool damage_crossed_half_hp_force_self_switch = 33 [(google.api.field_behavior) = REQUIRED];
  // 特性在匹配普通天气的回合末按最大生命固定比例回复的独立规则；省略表示没有该规则。
  GameAbilityWeatherEndTurnHeal weather_end_turn_heal = 8;
  // 特性在指定普通天气下按整数分数调整行动速度的独立规则集合。
  repeated GameAbilityWeatherSpeedMultiplier weather_speed_multipliers = 9 [(google.api.field_behavior) = REQUIRED];
  // 特性持有成员进入场地时建立的独立强天气；省略表示没有该规则。
  GameAbilitySwitchInStrongWeather switch_in_strong_weather = 10;
  // 特性持有成员进入场地时建立的独立普通天气；省略表示没有该规则。
  GameAbilitySwitchInWeather switch_in_weather = 11;
  // 特性持有成员进入场地时建立的独立普通场地；省略表示没有该规则。
  GameAbilitySwitchInTerrain switch_in_terrain = 12;
  // 特性持有成员进入场地时立即执行的独立能力阶级变化；省略表示没有该规则。
  GameAbilitySwitchInStatStageChange switch_in_stat_stage_change = 13;
  // 特性持有成员进入场地时为同侧其它上场成员回复生命；省略表示没有该规则。
  GameAbilitySwitchInAllyHeal switch_in_ally_heal = 14;
  // 特性持有成员入场时是否比较对手防御并强化自身攻击或特攻。
  bool switch_in_opponent_defense_comparison_boost = 15 [(google.api.field_behavior) = REQUIRED];
  // 特性持有成员进入场地时是否复制同侧其它上场成员的全部能力阶级。
  bool switch_in_ally_stat_stage_copy = 16 [(google.api.field_behavior) = REQUIRED];
  // 特性持有成员进入场地时是否将同侧其它上场成员的全部能力阶级重置为零。
  bool switch_in_ally_stat_stage_reset = 17 [(google.api.field_behavior) = REQUIRED];
  // 特性持有成员进入场地时是否清除双方阵营的反射壁、光墙和极光幕。
  bool switch_in_clear_all_side_damage_reductions = 18 [(google.api.field_behavior) = REQUIRED];
  // 特性持有成员进入场地时是否复制一名存活上场对手的当前特性及其冻结规则。
  bool switch_in_copy_opponent_ability = 19 [(google.api.field_behavior) = REQUIRED];
  // 特性持有成员进入场地时是否公开所有存活上场对手的持有道具。
  bool switch_in_reveal_opponent_held_items = 20 [(google.api.field_behavior) = REQUIRED];
  // 特性持有成员进入场地时是否公开所有存活上场对手中基础威力最高的技能。
  bool switch_in_reveal_opponent_highest_power_skill = 21 [(google.api.field_behavior) = REQUIRED];
  // 特性持有成员进入场地时是否复制一名存活上场对手的完整战斗画像。
  bool switch_in_transform_into_opponent = 22 [(google.api.field_behavior) = REQUIRED];
  // 特性持有成员进入场地时是否侦测一项对自身危险的对手技能。
  bool switch_in_detect_dangerous_opponent_skill = 23 [(google.api.field_behavior) = REQUIRED];
  // 特性持有成员进入场地时是否伪装为同侧最后一名可战斗队友。
  bool switch_in_disguise_as_last_healthy_ally = 24 [(google.api.field_behavior) = REQUIRED];
  // 特性持有成员进入场地时切换到指定形态的独立规则；省略表示没有该规则。
  GameAbilitySwitchInFormChange switch_in_form_change = 25;
  // 特性持有成员按当前有效普通天气同步形态的独立规则；省略表示没有该规则。
  GameAbilityWeatherFormChange weather_form_change = 26;
  // 特性持有成员进入场地时，是否按所持道具的属性伤害强化身份将自身属性替换为单属性。
  bool switch_in_held_item_element_identity = 27 [(google.api.field_behavior) = REQUIRED];
  // 特性在指定普通天气或普通场地下强化成员最高原始能力的独立规则；省略表示没有该规则。
  GameAbilityEnvironmentHighestStatMultiplier environment_highest_stat_multiplier = 28;
  // 特性持有成员完成太晶化后立即执行的独立能力阶级变化；省略表示没有该规则。
  GameAbilityTerastallizationStatStageChange terastallization_stat_stage_change = 29;
  // 特性持有成员完成太晶化后是否清除普通天气和普通场地；强天气不属于清除范围。
  bool terastallization_environment_clear = 30 [(google.api.field_behavior) = REQUIRED];
  // 特性持有成员成功离场时是否清除自身主要异常状态；倒下补位不触发。
  bool switch_out_major_status_cure = 34 [(google.api.field_behavior) = REQUIRED];
  // 特性持有成员成功离场时按最大生命回复的分母；0 表示没有该规则。
  int32 switch_out_heal_denominator = 35 [(google.api.field_behavior) = REQUIRED];
  // 特性持有成员成功离场时切换到指定形态的独立规则；省略表示没有该规则。
  GameAbilitySwitchOutFormChange switch_out_form_change = 36;
  // 特性是否限制敌方成员主动换人；省略表示不提供限制规则。
  GameAbilityOpponentSwitchRestriction opponent_switch_restriction = 37;
  // 特性修正持有成员任意技能命中率的整数分数；1/1 表示没有规则。
  GameAbilityAccuracyMultiplier accuracy_multiplier = 38;
  // 特性修正持有成员物理技能命中率的整数分数；1/1 表示没有规则。
  GameAbilityAccuracyMultiplier physical_skill_accuracy_multiplier = 39;
  // 特性在普通沙暴中修正以持有成员为目标的对手技能命中率；1/1 表示没有规则。
  GameAbilityAccuracyMultiplier opponent_accuracy_sandstorm_multiplier = 40;
  // 特性在普通降雪中修正以持有成员为目标的对手技能命中率；1/1 表示没有规则。
  GameAbilityAccuracyMultiplier opponent_accuracy_snow_multiplier = 41;
  // 特性在持有成员混乱时修正以其为目标的对手技能命中率；1/1 表示没有规则。
  GameAbilityAccuracyMultiplier opponent_accuracy_confusion_multiplier = 42;
  // 特性是否让持有成员使用技能或成为技能目标时跳过普通命中判定；一击必杀仍使用独立规则。
  bool accuracy_always_hits = 43 [(google.api.field_behavior) = REQUIRED];
  // 特性限制对手以持有成员为目标的变化技能最终命中率；0 表示没有规则。
  int32 status_skill_accuracy_cap = 44 [(google.api.field_behavior) = REQUIRED];
  // 特性是否在命中判定时忽略对手的命中或闪避能力阶级。
  bool ignore_opponent_accuracy_stat_stages = 45 [(google.api.field_behavior) = REQUIRED];
  // 特性是否阻止对手技能对持有成员造成击中要害；要害随机轨迹仍会照常记录。
  bool critical_hit_immunity = 46 [(google.api.field_behavior) = REQUIRED];
  // 特性是否使持有成员免疫按实际造成伤害计算的技能反作用；不影响按最大生命支付的技能代价或其它间接伤害。
  bool skill_recoil_damage_immunity = 47 [(google.api.field_behavior) = REQUIRED];
  // 特性是否在普通物理或特殊伤害公式中无视对手相关能力阶级；不修改权威状态中的真实阶级。
  bool ignore_opponent_damage_stat_stages = 48 [(google.api.field_behavior) = REQUIRED];
  // 特性是否让持有成员使用技能时无视目标侧防守特性；不影响目标的其它生命周期。
  bool ignore_target_ability_effects = 49 [(google.api.field_behavior) = REQUIRED];
  // 特性是否让满生命成员承受会使其倒下的对手技能伤害时保留 1 HP；不影响间接伤害。
  bool survive_fatal_damage_at_full_hp = 50 [(google.api.field_behavior) = REQUIRED];
  // 特性是否免疫对手使用的变化技能；不影响同侧辅助、自身目标或伤害技能。
  bool opponent_status_skill_immunity = 51 [(google.api.field_behavior) = REQUIRED];
  // 特性是否免疫属性相性不克制的对手伤害技能；不影响变化技能或克制伤害。
  bool non_super_effective_damage_immunity = 52 [(google.api.field_behavior) = REQUIRED];
  // 特性为持有成员固定增加的击中要害等级；0 表示未声明。
  int32 critical_hit_stage_boost = 53 [(google.api.field_behavior) = REQUIRED];
  // 特性是否让可变连续命中技能固定使用资料声明的最大段数。
  bool multi_hit_maximum = 54 [(google.api.field_behavior) = REQUIRED];
  // 特性是否阻止对手伤害技能施加给持有成员的追加效果。
  bool damaging_skill_secondary_effect_immunity = 55 [(google.api.field_behavior) = REQUIRED];
  // 特性是否阻止对手的正优先度技能影响持有成员所在一侧的当前上场成员。
  bool priority_move_immunity_for_side_enabled = 56 [(google.api.field_behavior) = REQUIRED];
  // 启用先制技能侧免疫时是否保护当前上场的同侧伙伴；未启用时必须为 false。
  bool priority_move_immunity_for_side_protects_allies = 57 [(google.api.field_behavior) = REQUIRED];
  // 特性是否令持有成员使用的变化技能在相同优先度内最后行动，并在该类技能结算期间无视目标防守特性。
  bool status_skill_moves_last_and_ignores_target_ability = 58 [(google.api.field_behavior) = REQUIRED];
  // 特性是否允许持有成员使用接触类对手技能时绕过目标个人保护；不会移除该保护状态。
  bool contact_skill_protection_bypass = 59 [(google.api.field_behavior) = REQUIRED];
  // 特性是否使持有成员的接触类技能失去本次有效接触事实；不会改写技能资料的静态标签。
  bool contact_suppression = 60 [(google.api.field_behavior) = REQUIRED];
  // 特性是否使持有成员受到实际接触伤害时的最终伤害减半；不影响非接触或特性穿透攻击。
  bool received_contact_damage_halved = 61 [(google.api.field_behavior) = REQUIRED];
  // 特性是否使持有成员受到火属性技能伤害时的最终伤害翻倍；不影响其它属性或特性穿透攻击。
  bool received_fire_damage_doubled = 62 [(google.api.field_behavior) = REQUIRED];
  // 特性是否使持有成员免疫天气、异常、束缚、寄生种子和入场危害等非技能直接伤害。
  bool indirect_damage_immunity = 63 [(google.api.field_behavior) = REQUIRED];
  // contact_damage_to_attacker_denominator 是目标受到有效接触本体伤害后反伤攻击者最大生命的正分母；0 表示未声明。
  int32 contact_damage_to_attacker_denominator = 64 [(google.api.field_behavior) = REQUIRED];
  // 特性按技能原始基础威力上限触发的独立最终伤害倍率；省略表示没有该规则。
  GameAbilityBasePowerAtMostDamageBoost base_power_at_most_damage_boost = 65;
  // 特性对按实际伤害产生反作用的技能提供的独立最终伤害倍率；省略表示没有该规则。
  GameAbilityRecoilSkillDamageBoost recoil_skill_damage_boost = 66;
  // 特性在低生命阈值下对指定有效属性提供的独立最终伤害倍率；省略表示没有该规则。
  GameAbilityLowHPElementDamageBoost low_hp_element_damage_boost = 67;
  // 特性在指定有效天气下对一组有效属性提供的独立最终伤害倍率；省略表示没有该规则。
  GameAbilityWeatherElementDamageBoost weather_element_damage_boost = 68;
  // 特性对一组技能有效属性提供的独立最终伤害倍率；省略表示没有该规则。
  GameAbilityElementSkillDamageBoost element_skill_damage_boost = 69;
  // 特性替换默认属性一致加成的独立精确倍率；省略表示继续使用默认倍率。
  GameAbilitySameElementBonusOverride same_element_bonus_override = 70;
  // 特性对本次仍构成有效接触的技能提供的独立最终伤害倍率；省略表示没有该规则。
  GameAbilityContactBasedSkillDamageBoost contact_based_skill_damage_boost = 71;
  // 特性对本次实际击中要害提供的独立额外最终伤害倍率；省略表示没有该规则。
  GameAbilityCriticalHitDamageBoost critical_hit_damage_boost = 72;
  // 特性对最终属性相性严格大于一的技能提供的独立最终伤害倍率；省略表示没有该规则。
  GameAbilitySuperEffectiveDamageBoost super_effective_damage_boost = 73;
  // 特性对最终属性相性位于零与一之间的技能提供的独立最终伤害倍率；省略表示没有该规则。
  GameAbilityNotVeryEffectiveDamageBoost not_very_effective_damage_boost = 74;
  // 回合末、受伤和倒下窗口执行的完整强类型特性规则；省略表示没有这些规则。
  GameReactiveAbilityRules reactive_ability_rules = 75;
  GameAbilityTargetGenderDamageMultiplier target_gender_damage_multiplier = 76;
  GameAbilityPunchBasedSkillDamageBoost punch_based_skill_damage_boost = 77;
  GameAbilitySlicingBasedSkillDamageBoost slicing_based_skill_damage_boost = 78;
  GameAbilitySoundBasedSkillDamageBoost sound_based_skill_damage_boost = 79;
  GameAbilityPulseBasedSkillDamageBoost pulse_based_skill_damage_boost = 80;
  GameAbilityBiteBasedSkillDamageBoost bite_based_skill_damage_boost = 81;
  GameAbilitySecondaryEffectsSuppressedDamageBoost secondary_effects_suppressed_damage_boost = 82;
  GameAbilitySoundBasedSkillDamageReduction sound_based_skill_damage_reduction = 83;
  GameAbilitySuperEffectiveDamageReduction super_effective_damage_reduction = 84;
  GameAbilityFullHPDamageReduction full_hp_damage_reduction = 85;
  GameAbilityDamageClassDamageReduction damage_class_damage_reduction = 86;
  GameAbilityElementSkillDamageReduction element_skill_damage_reduction = 87;
  GameAbilityContactBasedSkillDamageReduction contact_based_skill_damage_reduction = 88;
  GameAbilityAttackingStatMultiplier attacking_stat_multiplier = 89;
  GameAbilityOpponentAttackingStatMultiplier opponent_attacking_stat_multiplier = 90;
