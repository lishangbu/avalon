databaseChangeLog:
  - changeSet:
      id: 037-market-creature-index
      author: avalon
      changes:
        - addColumn:
            tableName: market_listing
            columns:
              - column: { name: creature_hidden, type: boolean, remarks: "上架伙伴是否为 H 隐藏特性槽位；非伙伴商品为空。" }
        - createTable:
            tableName: market_listing_skill
            remarks: "上架伙伴的技能检索集合；按完整技能名匹配，随挂单实物建立。"
            columns:
              - column:
                  name: listing_id
                  remarks: "对应市场挂单主键，挂单与技能名共同组成主键。"
                  type: bigint
                  constraints: { nullable: false, primaryKey: true, referencedTableName: market_listing, referencedColumnNames: id, foreignKeyName: market_listing_skill_listing }
              - column:
                  name: skill
                  remarks: "上架时已学技能的完整名称；用于精确匹配查询。"
                  type: varchar(255)
                  constraints: { nullable: false, primaryKey: true }
        - sql:
            sql: |
              UPDATE market_listing m SET creature_hidden=(p.ability_slot='H')
              FROM owned_creature p WHERE m.kind='CREATURE' AND m.asset_id=p.id;
              INSERT INTO market_listing_skill (listing_id, skill)
              SELECT DISTINCT m.id, jsonb_array_elements_text(p.skills::jsonb)
              FROM market_listing m JOIN owned_creature p ON m.asset_id=p.id WHERE m.kind='CREATURE';
