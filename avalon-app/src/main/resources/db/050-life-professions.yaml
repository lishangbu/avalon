databaseChangeLog:
  - changeSet:
      id: 050-life-professions
      author: avalon
      changes:
        - createTable:
            tableName: life_skill
            remarks: 角色生活技能；角色锁约束最多三个专业，半点熟练度保持衰减精度
            columns:
              - column:
                  name: character_id
                  type: bigint
                  remarks: 角色归属
                  constraints:
                    nullable: false
                    primaryKey: true
                    references: player_character(id)
                    foreignKeyName: life_skill_character_fk
              - column:
                  name: skill
                  type: varchar(24)
                  remarks: 生活技能稳定编号
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: half_points
                  type: bigint
                  defaultValueNumeric: 0
                  remarks: 累计半点熟练度，最高130816对应65408点
                  constraints:
                    nullable: false
        - createTable:
            tableName: life_skill_receipt
            remarks: 学习与遗忘请求回执，重放不误删重新学习的专业
            columns:
              - column:
                  name: character_id
                  type: bigint
                  remarks: 经认证解析的角色归属
                  constraints:
                    nullable: false
                    primaryKey: true
                    references: player_character(id)
                    foreignKeyName: life_skill_receipt_character_fk
              - column:
                  name: request_id
                  type: varchar(36)
                  remarks: 标准UUID幂等请求号
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: action
                  type: varchar(16)
                  remarks: LEARN或FORGET
                  constraints:
                    nullable: false
              - column:
                  name: skill
                  type: varchar(24)
                  remarks: 本次请求的技能编号
                  constraints:
                    nullable: false
        - sql:
            sql: ALTER TABLE life_skill ADD CONSTRAINT life_skill_points_check CHECK (half_points BETWEEN 0 AND 130816)
