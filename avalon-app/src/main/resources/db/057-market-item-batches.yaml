databaseChangeLog:
  - changeSet:
      id: 057-market-item-batches
      author: avalon
      changes:
        - sql:
            sql: |
              CREATE TABLE market_listing_item (
                listing_id BIGINT NOT NULL REFERENCES market_listing(id),
                asset_id BIGINT NOT NULL,
                remaining INTEGER NOT NULL CHECK (remaining > 0),
                PRIMARY KEY (listing_id, asset_id)
              );
              INSERT INTO market_listing_item (listing_id, asset_id, remaining)
              SELECT id, asset_id, remaining FROM market_listing
              WHERE kind = 'ITEM' AND remaining > 0;
              COMMENT ON TABLE market_listing_item IS '物品挂单按奖励来源分别保存托管实例与剩余数量';
              COMMENT ON COLUMN market_listing_item.listing_id IS '所属市场挂单';
              COMMENT ON COLUMN market_listing_item.asset_id IS '库存模块托管实例，保留原奖励出处';
              COMMENT ON COLUMN market_listing_item.remaining IS '该来源尚未成交或领取退货的数量';
