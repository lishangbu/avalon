databaseChangeLog:
  - changeSet:
      id: 009-fragment-crafting
      author: avalon
      dbms: postgresql
      comment: 材料、金币、成品和请求凭证同事务，重复提交不再次消耗。
      changes:
        - createTable:
            tableName: crafting_receipt
            remarks: "合成结果独立于成品库存数量保存，成品使用后重试旧请求也不会再发一本。"
            columns:
              - column:
                  name: id
                  remarks: "CosId 分配的雪花主键；仅用于稳定标识记录，不承载业务顺序。"
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: character_id
                  remarks: "所属角色主键；操作时由认证账号定位角色并校验归属。"
                  type: bigint
                  constraints:
                    nullable: false
                    referencedTableName: player_character
                    referencedColumnNames: id
                    foreignKeyName: crafting_receipt_character_id_fkey
              - column:
                  name: request_id
                  remarks: "客户端幂等请求号；同一归属下重复提交须核对原请求，不重复执行结算。"
                  type: varchar(36)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  remarks: "已核验请求的 JSON 文本；重试时比对原负载，拒绝同一请求号携带不同参数。"
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: product
                  remarks: "首次合成发放的成品物品编号，重试不重新选择配方结果。"
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: bound
                  remarks: "首次合成结果的绑定状态，独立于成品当前是否仍在背包保存。"
                  type: boolean
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: crafting_receipt
            columnNames: character_id,request_id
            constraintName: crafting_receipt_character_id_request_id_key
