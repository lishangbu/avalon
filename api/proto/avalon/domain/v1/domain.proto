message GameCreature {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string code = 2 [(google.api.field_behavior) = REQUIRED];
  string name = 3 [(google.api.field_behavior) = REQUIRED];
  string species_id = 4 [(google.api.field_behavior) = REQUIRED];
  string inherits_from_creature_id = 5 [(google.api.field_behavior) = REQUIRED];
  int32 height = 6 [(google.api.field_behavior) = REQUIRED];
  int32 weight = 7 [(google.api.field_behavior) = REQUIRED];
  int32 base_experience = 8 [(google.api.field_behavior) = REQUIRED];
  bool default_form = 9 [(google.api.field_behavior) = REQUIRED];
  bool enabled = 10 [(google.api.field_behavior) = REQUIRED];
  // gender_ratio 是该可参战形态的精确性别出现比率。
  GameCreatureGenderRatio gender_ratio = 11 [(google.api.field_behavior) = REQUIRED];
  // version 是该 Creature 记录的乐观并发版本。
  string version = 12 [(google.api.field_behavior) = REQUIRED];
  // capture_rate 是该具体形态可选的捕获率整数参数；上游明确未知时省略。
  optional int32 capture_rate = 13;
  // hatch_cycles 是该具体形态可选的孵化基础周期数；上游明确未知时省略。
  optional int32 hatch_cycles = 14;
}

// GameCreatureEvolution 是来源 Creature 满足条件后转换为目标 Creature 的有方向关系。
message GameCreatureEvolution {
  // id 是该进化关系的稳定 Snowflake Identifier；新建关系时可留空，由服务端生成。
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  // from_creature_id 是进化前来源 Creature 的稳定 Snowflake Identifier。
  string from_creature_id = 2 [(google.api.field_behavior) = REQUIRED];
  // to_creature_id 是进化后目标 Creature 的稳定 Snowflake Identifier。
  string to_creature_id = 3 [(google.api.field_behavior) = REQUIRED];
  // trigger_type 是 level、item、trade、friendship、skill、breeding 或 special 之一。
  string trigger_type = 4 [(google.api.field_behavior) = REQUIRED];
  // minimum_level 是等级条件要求的可选最低等级。
  optional int32 minimum_level = 5;
  // trigger_item_id 是使用、携带或查看的可选触发物品稳定 Snowflake Identifier。
  string trigger_item_id = 6;
  // minimum_friendship 是亲密度或友好度条件要求的可选最低值。
  optional int32 minimum_friendship = 7;
  // time_of_day 是 day、night 或 dusk 之一的可选时段限定。
  string time_of_day = 8;
  // gender 是 male 或 female 之一的可选性别限定。
  string gender = 9;
  // required_skill_id 是进化前必须掌握或使用的可选招式稳定 Snowflake Identifier。
  string required_skill_id = 10;
  // condition_text 是未丢失任何替代路径与补充限制的完整简体中文条件。
  string condition_text = 11 [(google.api.field_behavior) = REQUIRED];
  // enabled 表示该关系是否可用于新的 RPG 进度计算。
  bool enabled = 12 [(google.api.field_behavior) = REQUIRED];
  // version 是该进化关系记录的乐观并发版本；新建关系时可留空。
  string version = 13 [(google.api.field_behavior) = REQUIRED];
}

