databaseChangeLog:
  - changeSet:
      id: 034-market-receipt
      author: avalon
      changes:
        - createTable:
            tableName: market_receipt
            remarks: "市场操作回执和资金、实物同事务保存；同账号请求号跨操作唯一。"
            columns:
              - column:
                  name: id
                  remarks: "CosId 分配的雪花主键；仅用于稳定标识记录，不承载业务顺序。"
                  type: bigint
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: account_id
                  remarks: "所属账号主键；凭证按账号隔离，不能由客户端越权指定。"
                  type: bigint
                  constraints:
                    nullable: false
                    referencedTableName: account
                    referencedColumnNames: id
                    foreignKeyName: market_receipt_account_fkey
              - column:
                  name: request_id
                  remarks: "客户端幂等请求号；同一归属下重复提交须核对原请求，不重复执行结算。"
                  type: varchar(36)
                  constraints: { nullable: false }
              - column:
                  name: operation
                  remarks: "市场操作类型标识；与负载共同核验，禁止同一请求号重放为另一种操作。"
                  type: varchar(255)
                  constraints: { nullable: false }
              - column:
                  name: payload
                  remarks: "已核验请求的 JSON 文本；重试时比对原负载，拒绝同一请求号携带不同参数。"
                  type: text
                  constraints: { nullable: false }
              - column:
                  name: result
                  remarks: "首次结算结果的 JSON 文本；重试返回原结果，不重新扣费、抽取或发奖。"
                  type: text
                  constraints: { nullable: false }
        - addUniqueConstraint:
            tableName: market_receipt
            columnNames: account_id,request_id
            constraintName: market_receipt_request_key
