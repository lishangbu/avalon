databaseChangeLog:
  - changeSet:
      id: 023-dungeon-invitation
      author: avalon
      dbms: postgresql
      comment: ''
      changes:
        - createTable:
            tableName: dungeon_invitation
            remarks: "邀请收件箱与队伍占位分离；只有接受事务才调用正式入队命令。"
            columns:
              - column:
                  name: id
                  remarks: "CosId 分配的雪花主键；仅用于稳定标识记录，不承载业务顺序。"
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: lobby_id
                  remarks: "受邀加入的副本队伍主键；接受时仍需校验队伍有效性和容量。"
                  type: bigint
                  constraints:
                    nullable: false
                    referencedTableName: dungeon_lobby
                    referencedColumnNames: id
                    foreignKeyName: dungeon_invitation_lobby_id_fkey
              - column:
                  name: sender_id
                  remarks: "邀请发起者的角色主键；用于验证发送资格与展示邀请来源。"
                  type: bigint
                  constraints:
                    nullable: false
                    referencedTableName: player_character
                    referencedColumnNames: id
                    foreignKeyName: dungeon_invitation_sender_id_fkey
              - column:
                  name: recipient_id
                  remarks: "邀请接收者的角色主键；仅该角色可接受或拒绝邀请。"
                  type: bigint
                  constraints:
                    nullable: false
                    referencedTableName: player_character
                    referencedColumnNames: id
                    foreignKeyName: dungeon_invitation_recipient_id_fkey
              - column:
                  name: request_id
                  remarks: "客户端幂等请求号；同一归属下重复提交须核对原请求，不重复执行结算。"
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  remarks: "邀请失效时间；达到该时间后不能接受，不因查看而延长。"
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: status
                  remarks: "邀请状态：PENDING 待处理、ACCEPTED 已接受、DECLINED 已拒绝、EXPIRED 已过期。"
                  type: varchar(12)
                  constraints:
                    nullable: false
        - sql:
            dbms: postgresql
            sql: ALTER TABLE dungeon_invitation ADD CONSTRAINT dungeon_invitation_status_check CHECK (status IN
              ('PENDING', 'ACCEPTED', 'DECLINED', 'EXPIRED'));
        - addUniqueConstraint:
            tableName: dungeon_invitation
            columnNames: sender_id,request_id
            constraintName: dungeon_invitation_sender_id_request_id_key
        - sql:
            dbms: postgresql
            sql: ALTER TABLE dungeon_invitation ADD CONSTRAINT dungeon_invitation_check CHECK (sender_id <> recipient_id);
        - sql:
            dbms: postgresql
            sql: CREATE UNIQUE INDEX dungeon_invitation_pending ON dungeon_invitation(lobby_id, recipient_id) WHERE
              status = 'PENDING';
        - sql:
            dbms: postgresql
            sql: CREATE INDEX dungeon_invitation_inbox ON dungeon_invitation(recipient_id, id) WHERE status = 'PENDING';
