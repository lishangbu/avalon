# 聊天正文与逐条已读独立存储：战斗期间仍可收消息，绝不自动推进已读。
# 普通表采用结构化迁移；CHECK、部分索引及复合唯一约束用 PostgreSQL SQL 表达。
databaseChangeLog:
  - changeSet:
      id: 058-chat
      author: avalon
      dbms: postgresql
      comment: 私聊、世界聊天、系统通知与角色级拒收规则
      changes:
        - createTable:
            tableName: chat_message
            remarks: "聊天纯文本主表；玩家消息与可信系统通知共享持久化，私聊和个人通知长期保留，公共历史七天到期。"
            columns:
              - column:
                  name: id
                  type: bigint
                  remarks: "消息雪花主键；排序分页用字符串传输，不依赖主键表达提交先后"
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: channel
                  type: varchar(10)
                  remarks: "WORLD、PRIVATE或SYSTEM"
                  constraints:
                    nullable: false
              - column:
                  name: sender
                  type: bigint
                  remarks: "玩家消息的发送角色；系统消息为空"
                  constraints:
                    nullable: true
              - column:
                  name: sender_name
                  type: varchar(32)
                  remarks: "发送时的角色显示名，系统显示系统"
                  constraints:
                    nullable: false
              - column:
                  name: recipient
                  type: bigint
                  remarks: "私聊或个人通知的接收角色；公开消息为空"
                  constraints:
                    nullable: true
              - column:
                  name: recipient_name
                  type: varchar(32)
                  remarks: "私聊收件角色公开名快照"
                  constraints:
                    nullable: true
              - column:
                  name: text
                  type: text
                  remarks: "仅保存纯文本，页面禁止作为HTML渲染"
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  remarks: "数据库插入时刻；公共消息七天到期"
                  constraints:
                    nullable: false
              - column:
                  name: request_id
                  type: varchar(100)
                  remarks: "玩家UUID或可信业务来源键，用于防重"
                  constraints:
                    nullable: false
        - createTable:
            tableName: chat_settings
            remarks: "角色级聊天接收偏好与最近成功发送时刻；查询不创建默认行，设置变更不重置频率。"
            columns:
              - column:
                  name: character_id
                  type: bigint
                  remarks: "角色级拒收设置；与角色锁内发送状态一起持久化"
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: reject_strangers
                  type: boolean
                  remarks: "仅接受已经成为好友的角色私聊"
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: last_sent_at
                  type: timestamp with time zone
                  remarks: "跨频道最近一次成功发送时刻，失败发送不更新"
                  constraints:
                    nullable: true
        - createTable:
            tableName: chat_block
            remarks: "本人主动建立的有方向黑名单；阻止后续私聊并过滤本人所见发言，不删除对方角色或历史。"
            columns:
              - column:
                  name: character_id
                  type: bigint
                  remarks: "执行拉黑的角色"
                  constraints:
                    nullable: false
              - column:
                  name: peer
                  type: bigint
                  remarks: "被拉黑角色"
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(32)
                  remarks: "公开显示名快照，用于解除拉黑"
                  constraints:
                    nullable: false
        - createTable:
            tableName: chat_seen
            remarks: "角色逐消息已读凭证；仅显式展示确认后写入，避免事务提交乱序造成新消息误读。"
            columns:
              - column:
                  name: character_id
                  type: bigint
                  remarks: "实际展示并确认消息的角色"
                  constraints:
                    nullable: false
              - column:
                  name: message_id
                  type: bigint
                  remarks: "逐条消息已读凭证，避免雪花生成与事务提交乱序漏标"
                  constraints:
                    nullable: false
              - column:
                  name: seen_at
                  type: timestamp with time zone
                  remarks: "首次阅读时刻；重复确认幂等"
                  constraints:
                    nullable: false
        - sql:
            sql: |
              ALTER TABLE chat_message ADD CONSTRAINT chat_message_shape CHECK (
                (channel='WORLD' AND sender IS NOT NULL AND recipient IS NULL) OR
                (channel='PRIVATE' AND sender IS NOT NULL AND recipient IS NOT NULL AND sender<>recipient) OR
                (channel='SYSTEM' AND sender IS NULL));
              ALTER TABLE chat_message ADD CONSTRAINT chat_message_length CHECK (char_length(text) BETWEEN 1 AND 500);
              ALTER TABLE chat_message ADD CONSTRAINT chat_message_sender_fk FOREIGN KEY(sender) REFERENCES player_character(id);
              ALTER TABLE chat_message ADD CONSTRAINT chat_message_recipient_fk FOREIGN KEY(recipient) REFERENCES player_character(id);
              CREATE UNIQUE INDEX chat_player_request ON chat_message(sender,request_id) WHERE sender IS NOT NULL;
              CREATE UNIQUE INDEX chat_system_request ON chat_message(request_id) WHERE sender IS NULL;
              CREATE INDEX chat_public_history ON chat_message(channel,id DESC) WHERE recipient IS NULL;
              CREATE INDEX chat_incoming ON chat_message(recipient,id DESC);
              CREATE INDEX chat_outgoing ON chat_message(sender,id DESC);
              CREATE INDEX chat_sender_rate ON chat_message(sender,created_at DESC) WHERE sender IS NOT NULL;
              CREATE INDEX chat_retention ON chat_message(created_at) WHERE channel='WORLD' OR (channel='SYSTEM' AND recipient IS NULL);
              ALTER TABLE chat_settings ADD CONSTRAINT chat_settings_character_fk FOREIGN KEY(character_id) REFERENCES player_character(id);
              ALTER TABLE chat_block ADD PRIMARY KEY(character_id,peer);
              ALTER TABLE chat_block ADD CONSTRAINT chat_block_self CHECK(character_id<>peer);
              ALTER TABLE chat_block ADD CONSTRAINT chat_block_character_fk FOREIGN KEY(character_id) REFERENCES player_character(id);
              ALTER TABLE chat_block ADD CONSTRAINT chat_block_peer_fk FOREIGN KEY(peer) REFERENCES player_character(id);
              ALTER TABLE chat_seen ADD PRIMARY KEY(character_id,message_id);
              ALTER TABLE chat_seen ADD CONSTRAINT chat_seen_character_fk FOREIGN KEY(character_id) REFERENCES player_character(id);
              ALTER TABLE chat_seen ADD CONSTRAINT chat_seen_message_fk FOREIGN KEY(message_id) REFERENCES chat_message(id) ON DELETE CASCADE;
