databaseChangeLog:
  - changeSet:
      id: 015-movement-retry
      author: avalon
      dbms: postgresql
      comment: 到达事件可能触发多次 flush，移动幂等不能依赖 JPA 版本恰好增加一。
      changes:
        - addColumn:
            tableName: player_character
            columns:
              - column:
                  name: last_move_revision
                  remarks: "最近成功移动的客户端版本；剧情救援或战败传送后清空，不能重放旧道路请求。"
                  type: bigint
