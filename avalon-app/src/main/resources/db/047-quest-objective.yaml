databaseChangeLog:
  - changeSet:
      id: 047-quest-objective
      author: avalon
      changes:
        - createTable:
            tableName: quest_objective
            remarks: 接取有效期间完成的任务步骤目标，放弃保留但不再累计
            columns:
              - column:
                  name: id
                  type: bigint
                  remarks: CosId雪花主键
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: character_id
                  type: bigint
                  remarks: 真实行为归属角色
                  constraints:
                    nullable: false
                    referencedTableName: player_character
                    referencedColumnNames: id
                    foreignKeyName: fk_quest_objective_character
              - column:
                  name: step
                  type: varchar(255)
                  remarks: 获得目标进度的任务步骤编号
                  constraints:
                    nullable: false
              - column:
                  name: fact
                  type: varchar(255)
                  remarks: 正式内容声明的目标事实编号
                  constraints:
                    nullable: false
              - column:
                  name: completed_at
                  type: timestamp with time zone
                  remarks: 首次在有效接取期间完成目标的时间
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: quest_objective
            columnNames: character_id, step, fact
            constraintName: uq_quest_objective_character_step_fact
