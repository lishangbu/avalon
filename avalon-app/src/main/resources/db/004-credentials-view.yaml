databaseChangeLog:
  - changeSet:
      id: 004-credentials-view
      author: avalon
      dbms: postgresql
      comment: Security JPA 在应用根索引发现身份定义，使用只读视图适配跨模块账号实体。
      changes:
        - createView:
            viewName: account_credentials
            remarks: "Security JPA 的只读身份适配器。当前扩展只扫描应用根索引的 UserDefinition， 因此将认证投影放在启动模块；账号写模型与事务继续属于 identity 模块。 视图直接读取账号表，没有第二份密码数据，也不通过此实体更新账号。"
            selectQuery: SELECT id, username, password_hash, roles FROM account
        - setColumnRemarks:
            tableName: account_credentials
            columnName: id
            remarks: "只读视图映射的账号主键，与账号表相同，不重新生成；本实体不得作为HTTP响应序列化。"
        - setColumnRemarks:
            tableName: account_credentials
            columnName: username
            remarks: "登录账号，数据库唯一约束处理并发注册竞争。密码认证和角色名是不同概念。"
        - setColumnRemarks:
            tableName: account_credentials
            columnName: password_hash
            remarks: "bcrypt 密码摘要；不保存明文密码，不允许返回给 HTTP 客户端或写入业务日志。"
        - setColumnRemarks:
            tableName: account_credentials
            columnName: roles
            remarks: "逗号分隔的权限角色集合，供 Security JPA 和会话认证构建身份使用。"
