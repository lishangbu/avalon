services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: avalon
      POSTGRES_USER: avalon
      POSTGRES_PASSWORD: avalon-local-only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - avalon-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U avalon -d avalon" ]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  avalon-postgres:
