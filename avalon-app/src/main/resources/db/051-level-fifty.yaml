databaseChangeLog:
  - changeSet:
      id: 051-level-fifty
      author: avalon
      comment: 人物与幻兽成长扩展至50级，已有累计经验保持不变
      changes:
        - sql:
            sql: ALTER TABLE player_character DROP CONSTRAINT player_character_experience_check
        - sql:
            sql: ALTER TABLE player_character ADD CONSTRAINT player_character_experience_check CHECK (experience BETWEEN 0 AND 23935620)
        - sql:
            sql: ALTER TABLE owned_creature DROP CONSTRAINT owned_creature_level_check
        - sql:
            sql: ALTER TABLE owned_creature ADD CONSTRAINT owned_creature_level_check CHECK (level BETWEEN 1 AND 50)
