databaseChangeLog:
  - changeSet:
      id: 035-market-item-index
      author: avalon
      dbms: postgresql
      changes:
        - addColumn:
            tableName: market_listing
            columns:
              - column: { name: item_code, type: varchar(255), remarks: "上架时从已核对实物建立查询索引；托管期间不能培养或修改实例属性。" }
              - column: { name: item_name, type: varchar(255), remarks: "上架时的物品名称或伙伴昵称，用于市场展示和名称检索。" }
              - column: { name: item_slot, type: varchar(255), remarks: "上架装备的部位编号；非装备为空，不能作为装备匹配。" }
              - column: { name: item_quality, type: varchar(255), remarks: "上架装备的品质标识；没有品质的商品为空。" }
              - column: { name: item_level, type: integer, remarks: "上架装备的穿戴等级或伙伴等级；按商品类型解释，用于范围筛选。" }
              - column: { name: item_category, type: varchar(16), remarks: "检索分类：EQUIPMENT 装备、BOOK 技能书、FRAGMENT 碎片、MATERIAL 材料、CREATURE 伙伴。" }
        - sql:
            sql: |
              UPDATE market_listing m SET item_code=i.code, item_name=i.name, item_slot=i.slot,
                item_quality=i.quality, item_level=i.required_level,
                item_category=CASE WHEN i.slot IS NOT NULL THEN 'EQUIPMENT'
                  WHEN i.code LIKE 'BOOK\_%' ESCAPE '\' THEN 'BOOK'
                  WHEN i.code LIKE 'FRAGMENT\_%' ESCAPE '\' THEN 'FRAGMENT' ELSE 'MATERIAL' END
              FROM owned_item i WHERE m.kind='ITEM' AND m.asset_id=i.id;
        - createIndex:
            tableName: market_listing
            indexName: market_listing_item_search
            columns:
              - column: { name: state }
              - column: { name: item_category }
              - column: { name: unit_price }
              - column: { name: id }
