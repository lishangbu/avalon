message EquipmentStatModifier { string id = 1; string stat_id = 2 [(google.api.field_behavior) = REQUIRED]; int64 flat_value = 3; int32 percentage_bps = 4 [(buf.validate.field).int32 = {gte: -10000, lte: 100000}]; }
// AdminEquipment 是管理端读取和原子保存的完整装备资料聚合。
message AdminEquipment {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  string item_id = 2 [(google.api.field_behavior) = REQUIRED];
  string item_name = 3 [(google.api.field_behavior) = REQUIRED];
  string slot_type = 4 [(google.api.field_behavior) = REQUIRED];
  optional string handedness = 5;
  int32 minimum_level = 6 [(buf.validate.field).int32.gt = 0];
  int64 sell_price = 7 [(buf.validate.field).int64.gte = 0];
  bool enabled = 8;
  int64 version = 9 [(buf.validate.field).int64.gt = 0];
  repeated string profession_ids = 10 [(google.api.field_behavior) = REQUIRED];
  repeated EquipmentStatModifier stat_modifiers = 11 [(google.api.field_behavior) = REQUIRED];
  repeated string rule_timings = 12 [(google.api.field_behavior) = REQUIRED];
  int64 instance_count = 13 [(buf.validate.field).int64.gte = 0];
  string sell_currency_id = 14 [(google.api.field_behavior) = REQUIRED];
}
message SaveEquipmentBody { string item_id = 1 [(google.api.field_behavior) = REQUIRED]; string slot_type = 2 [(google.api.field_behavior) = REQUIRED]; optional string handedness = 3; int32 minimum_level = 4 [(buf.validate.field).int32.gt = 0]; int64 sell_price = 5 [(buf.validate.field).int64.gte = 0]; bool enabled = 6; repeated string profession_ids = 7 [(google.api.field_behavior) = REQUIRED]; repeated EquipmentStatModifier stat_modifiers = 8 [(google.api.field_behavior) = REQUIRED]; repeated string rule_timings = 9 [(google.api.field_behavior) = REQUIRED]; string sell_currency_id = 10 [(google.api.field_behavior) = REQUIRED]; }
message ListEquipmentsRequest { int32 page_size = 1 [(buf.validate.field).int32 = {gte: 1, lte: 100}]; string cursor = 2 [(buf.validate.field).string.max_len = 2048]; }
message ListEquipmentsResponse { repeated AdminEquipment equipments = 1 [(google.api.field_behavior) = REQUIRED]; string next_cursor = 2; }
// EquipmentOption 是管理表单选择启用装备时使用的最小只读引用。
message EquipmentOption { string id = 1 [(google.api.field_behavior) = REQUIRED]; string item_name = 2 [(google.api.field_behavior) = REQUIRED]; }
message ListEquipmentOptionsRequest {}
message ListEquipmentOptionsResponse { repeated EquipmentOption options = 1 [(google.api.field_behavior) = REQUIRED]; }
message SaveEquipmentRequest { string equipment_id = 1; int64 expected_version = 2 [(buf.validate.field).int64.gte = 0]; string idempotency_key = 3 [(google.api.field_behavior) = REQUIRED]; SaveEquipmentBody body = 4 [(google.api.field_behavior) = REQUIRED]; }
message SaveEquipmentResponse { AdminEquipment equipment = 1 [(google.api.field_behavior) = REQUIRED]; }
// AdminEquipmentInstance 是管理端诊断所需的实例归属、来源和可选穿戴槽位。
message AdminEquipmentInstance { string id = 1; string player_character_id = 2; string equipment_id = 3; string item_name = 4; string source_type = 5; optional string source_reference_id = 6; optional string equipped_slot = 7; int64 version = 8; google.protobuf.Timestamp acquired_at = 9; optional google.protobuf.Timestamp sold_at = 10; }
message ListAdminEquipmentInstancesRequest { int32 page_size = 1 [(buf.validate.field).int32 = {gte: 1, lte: 100}]; string player_character_id = 2; string equipment_id = 3; optional bool equipped = 4; string source_type = 5; string cursor = 6 [(buf.validate.field).string.max_len = 2048]; }
message ListAdminEquipmentInstancesResponse { repeated AdminEquipmentInstance instances = 1 [(google.api.field_behavior) = REQUIRED]; string next_cursor = 2; }
// EquipmentTransaction 是管理端只读的不可变装备资产流水。
message EquipmentTransaction { string id = 1; string operation_id = 2; string player_character_id = 3; string equipment_instance_id = 4; string action = 5; optional string source_type = 6; optional string slot = 7; google.protobuf.Timestamp created_at = 8; }
message ListEquipmentTransactionsRequest { int32 page_size = 1 [(buf.validate.field).int32 = {gte: 1, lte: 100}]; string player_character_id = 2; string equipment_instance_id = 3; string action = 4; string cursor = 5 [(buf.validate.field).string.max_len = 2048]; }
message ListEquipmentTransactionsResponse { repeated EquipmentTransaction transactions = 1 [(google.api.field_behavior) = REQUIRED]; string next_cursor = 2; }
message GrantEquipmentRequest { string player_character_id = 1 [(google.api.field_behavior) = REQUIRED]; string equipment_id = 2 [(google.api.field_behavior) = REQUIRED]; int32 quantity = 3 [(buf.validate.field).int32 = {gte: 1, lte: 100}]; string reason = 4 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string = {min_len: 1, max_len: 500}]; string idempotency_key = 5 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string = {min_len: 1, max_len: 128}]; }
message GrantEquipmentResponse { string operation_id = 1 [(google.api.field_behavior) = REQUIRED]; repeated string equipment_instance_ids = 2 [(google.api.field_behavior) = REQUIRED]; }

// ExitCondition 是后端闭集条件树，禁止脚本和自由 map。
message ExitCondition {
  oneof node {
    ConditionAll all = 1;
    ConditionAny any = 2;
    ConditionNot not = 3;
    LevelAtLeast level_at_least = 4;
    ItemCountAtLeast item_count_at_least = 5;
    QuestObjectiveAtLeast quest_objective_at_least = 6;
    HasProfession has_profession = 7;
    WorldStateEquals world_state_equals = 8;
  }
}
message ConditionAll { repeated ExitCondition children = 1 [(google.api.field_behavior) = REQUIRED]; }
message ConditionAny { repeated ExitCondition children = 1 [(google.api.field_behavior) = REQUIRED]; }
message ConditionNot { ExitCondition child = 1 [(google.api.field_behavior) = REQUIRED]; }
message LevelAtLeast { int32 value = 1 [(buf.validate.field).int32.gt = 0]; }
message ItemCountAtLeast { string item_code = 1 [(google.api.field_behavior) = REQUIRED]; int32 value = 2 [(buf.validate.field).int32.gt = 0]; }
message QuestObjectiveAtLeast { string objective_code = 1 [(google.api.field_behavior) = REQUIRED]; int32 value = 2 [(buf.validate.field).int32.gt = 0]; }
message HasProfession { string profession_code = 1 [(google.api.field_behavior) = REQUIRED]; }
message WorldStateEquals { string key = 1 [(google.api.field_behavior) = REQUIRED]; bool value = 2; }

// TraversalEffect 是移动事务内唯一允许的白名单副作用。
message TraversalEffect {
  oneof effect {
    SetWorldState set_world_state = 1;
    IncrementQuestObjective increment_quest_objective = 2;
  }
}
message SetWorldState { string key = 1 [(google.api.field_behavior) = REQUIRED]; bool value = 2; }
message IncrementQuestObjective { string objective_code = 1 [(google.api.field_behavior) = REQUIRED]; int32 value = 2 [(buf.validate.field).int32.gt = 0]; }

// ListIntegrityReportsRequest 是管理员完整性报告分页请求。
message ListIntegrityReportsRequest { string cursor = 1 [(buf.validate.field).string.max_len = 2048]; int32 page_size = 2 [(buf.validate.field).int32 = {gte: 1, lte: 100}]; }
// ListIntegrityReportsResponse 返回报告页面。
message ListIntegrityReportsResponse { repeated IntegrityReport reports = 1 [(google.api.field_behavior) = REQUIRED]; string next_cursor = 2; }
// IntegrityReport 是一次拓扑校验的只读结果。
message IntegrityReport { string id = 1 [(google.api.field_behavior) = REQUIRED, (buf.validate.field).string.pattern = "^[1-9][0-9]{0,18}$"]; google.protobuf.Timestamp checked_at = 2 [(google.api.field_behavior) = REQUIRED]; bool passed = 3; repeated IntegrityIssue issues = 4 [(google.api.field_behavior) = REQUIRED]; }
// IntegrityIssue 是一个稳定 reason code 和中文说明。
message IntegrityIssue { string reason_code = 1 [(google.api.field_behavior) = REQUIRED]; string resource_id = 2; string message = 3 [(google.api.field_behavior) = REQUIRED]; }
