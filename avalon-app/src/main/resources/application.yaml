# 单体同步 JDBC，虚拟线程处理请求，禁止在响应序列化阶段隐式读取数据库。
spring:
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  application:
    name: avalon
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
  jpa:
    database-platform: io.github.lishangbu.avalon.platform.persistence.AvalonPostgreSQLDialect
    open-in-view: false
    properties:
      hibernate.hbm2ddl.halt_on_error: true
      hibernate.schema_update.unique_constraint_strategy: RECREATE_QUIETLY
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
management:
  endpoints:
    web:
      exposure:
        include: health
# CosId 5 按应用上下文管理运行时；静态机器槽位由部署方保证各实例唯一。
cosid:
  enabled: true
  namespace: avalon
  machine:
    static:
      bits: 10
  generators:
    default:
      strategy: snowflake
      # 保留 4.x 的纪元和 41/10/12 位布局，兼容已有数据库主键。
      layout: SNOWFLAKE_MS
      regression:
        borrow-up-to: 5ms
        wait-up-to: 1s
      codec:
        - radix:
            radix: 10
  metrics:
    generated:
      enabled: true

# 战斗记录仅保存文本；生产容器挂载该目录，活动战斗不受结束记录保留期限影响。
avalon:
  battle:
    logs:
      directory: logs/battles
      retention-days: 30
