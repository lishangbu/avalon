databaseChangeLog:
  - changeSet:
      id: 025-book-recycling
      author: avalon
      dbms: postgresql
      comment: ''
      changes:
        - createTable:
            tableName: book_recycling_receipt
            remarks: "记录玩家确认的书目、数量和报价，与库存及金币原子提交。"
            columns:
              - column:
                  name: id
                  remarks: "CosId 分配的雪花主键；仅用于稳定标识记录，不承载业务顺序。"
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: character_id
                  remarks: "所属角色主键；操作时由认证账号定位角色并校验归属。"
                  type: bigint
                  constraints:
                    nullable: false
                    referencedTableName: player_character
                    referencedColumnNames: id
                    foreignKeyName: book_recycling_receipt_character_id_fkey
              - column:
                  name: request_id
                  remarks: "客户端幂等请求号；同一归属下重复提交须核对原请求，不重复执行结算。"
                  type: varchar(36)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  remarks: "已核验请求的 JSON 文本；重试时比对原负载，拒绝同一请求号携带不同参数。"
                  type: text
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: book_recycling_receipt
            columnNames: character_id,request_id
            constraintName: book_recycling_receipt_character_id_request_id_key
