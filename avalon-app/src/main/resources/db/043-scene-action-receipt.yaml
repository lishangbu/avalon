databaseChangeLog:
  - changeSet:
      id: 043-scene-action-receipt
      author: avalon
      changes:
        - createTable:
            tableName: scene_action_receipt
            remarks: 场景动作幂等回执，与成功事实及任务物品同事务提交
            columns:
              - column:
                  name: id
                  type: bigint
                  remarks: CosId生成的雪花主键
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: character_id
                  type: bigint
                  remarks: 执行动作的角色归属
                  constraints:
                    nullable: false
                    referencedTableName: player_character
                    referencedColumnNames: id
                    foreignKeyName: fk_scene_action_character
              - column:
                  name: request_id
                  type: varchar(36)
                  remarks: 角色内唯一标准UUID请求号
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: text
                  remarks: 原动作编号、位置版本和报告选项，重试必须一致
                  constraints:
                    nullable: false
              - column:
                  name: response
                  type: text
                  remarks: 原始成功或错误报告响应，重放不执行奖励
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: scene_action_receipt
            columnNames: character_id, request_id
            constraintName: uq_scene_action_character_request
