databaseChangeLog:
  - changeSet:
      id: 024-creature-rename
      author: avalon
      dbms: postgresql
      comment: ''
      changes:
        - addColumn:
            tableName: owned_creature
            columns:
              - column:
                  name: rename_count
                  remarks: "成功更名次数随个体保存；不由名称是否等于物种默认名推算免费资格。"
                  type: integer
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - sql:
            dbms: postgresql
            sql: ALTER TABLE owned_creature ADD CONSTRAINT owned_creature_rename_count_check CHECK (rename_count
              >= 0);
        - createTable:
            tableName: creature_rename_receipt
            remarks: "改名凭证与金币和名称同事务保存，避免响应丢失后重复收费。"
            columns:
              - column:
                  name: id
                  remarks: "CosId 分配的雪花主键；仅用于稳定标识记录，不承载业务顺序。"
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: character_id
                  remarks: "所属角色主键；操作时由认证账号定位角色并校验归属。"
                  type: bigint
                  constraints:
                    nullable: false
                    referencedTableName: player_character
                    referencedColumnNames: id
                    foreignKeyName: creature_rename_receipt_character_id_fkey
              - column:
                  name: request_id
                  remarks: "客户端幂等请求号；同一归属下重复提交须核对原请求，不重复执行结算。"
                  type: varchar(36)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  remarks: "已核验请求的 JSON 文本；重试时比对原负载，拒绝同一请求号携带不同参数。"
                  type: text
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: creature_rename_receipt
            columnNames: character_id,request_id
            constraintName: creature_rename_receipt_character_id_request_id_key
