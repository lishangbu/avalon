databaseChangeLog:
  - changeSet:
      id: 019-dungeon-lobby
      author: avalon
      dbms: postgresql
      comment: ''
      changes:
        - createTable:
            tableName: dungeon_lobby
            remarks: "最早成员截止时间独立索引，避免 Quartz 扫描全部 JSON 存档。"
            columns:
              - column:
                  name: id
                  remarks: "CosId 分配的雪花主键；仅用于稳定标识记录，不承载业务顺序。"
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: leader_id
                  remarks: "发起副本或队伍的角色主键，不是账号编号。"
                  type: bigint
                  constraints:
                    nullable: false
                    referencedTableName: player_character
                    referencedColumnNames: id
                    foreignKeyName: dungeon_lobby_leader_id_fkey
              - column:
                  name: request_id
                  remarks: "客户端幂等请求号；同一归属下重复提交须核对原请求，不重复执行结算。"
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: open
                  remarks: "队伍是否仍开放；关闭后的历史记录不能继续接受入队。"
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: deadline
                  remarks: "最早成员的确认截止时间；无待超时占位时允许为空，用于定时清理查询。"
                  type: timestamp with time zone
              - column:
                  name: state
                  remarks: "完整运行状态的 JSON 文本，用于重连恢复；仅由对应应用命令更新。"
                  type: text
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: dungeon_lobby
            columnNames: leader_id,request_id
            constraintName: dungeon_lobby_leader_id_request_id_key
        - sql:
            dbms: postgresql
            sql: CREATE INDEX dungeon_lobby_deadline ON dungeon_lobby(deadline) WHERE open;
        - addColumn:
            tableName: player_character
            columns:
              - column:
                  name: dungeon_lobby_id
                  remarks: "匹配占位与正式副本分离；确认期限内只限制新开个人战斗，不中断当前战局。"
                  type: bigint
                  constraints:
                    referencedTableName: dungeon_lobby
                    referencedColumnNames: id
                    foreignKeyName: player_character_dungeon_lobby_id_fkey
        - addColumn:
            tableName: player_character
            columns:
              - column:
                  name: dungeon_hold_until
                  remarks: "副本组队确认占位的截止时间；没有占位时为空，超时由组队流程释放。"
                  type: timestamp with time zone
