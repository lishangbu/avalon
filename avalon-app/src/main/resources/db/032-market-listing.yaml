databaseChangeLog:
  - changeSet:
      id: 032-market-listing
      author: avalon
      dbms: postgresql
      changes:
        - createTable:
            tableName: market_listing
            remarks: "挂单保存托管数量和固定截止时间；部分成交只减少 remaining，不刷新期限。 实物保持所属模块管理，assetId 指向托管实例；跨模块不建立 JPA 关联。"
            columns:
              - column:
                  name: id
                  remarks: "CosId 分配的雪花主键；仅用于稳定标识记录，不承载业务顺序。"
                  type: bigint
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: seller_account_id
                  remarks: "卖家账号主键；资金结算和跨账号锁按账号编号处理。"
                  type: bigint
                  constraints:
                    nullable: false
                    referencedTableName: account
                    referencedColumnNames: id
                    foreignKeyName: market_listing_seller_fkey
              - column:
                  name: asset_id
                  remarks: "托管实物的实例主键；根据 kind 指向物品或伙伴，不建立跨模块实体关联。"
                  type: bigint
                  constraints: { nullable: false }
              - column:
                  name: kind
                  remarks: "托管实物类型：ITEM 为物品或装备，CREATURE 为伙伴。"
                  type: varchar(16)
                  constraints: { nullable: false }
              - column:
                  name: state
                  remarks: "挂单状态：ACTIVE 在售、SOLD 售罄、RETURN_PENDING 待领退货、RETURNED 已领退货。"
                  type: varchar(24)
                  constraints: { nullable: false }
              - column:
                  name: unit_price
                  remarks: "每件商品的金币单价；成交按数量计算总价，再按规则扣税。"
                  type: bigint
                  constraints: { nullable: false }
              - column:
                  name: original_quantity
                  remarks: "首次上架的总数量；部分成交不修改该历史值。"
                  type: integer
                  constraints: { nullable: false }
              - column:
                  name: remaining
                  remarks: "尚未售出或领取退货的托管数量；降为零后挂单进入终态。"
                  type: integer
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  remarks: "首次成功创建时间，使用服务端时间保存；重试不覆盖。"
                  type: timestamp with time zone
                  constraints: { nullable: false }
              - column:
                  name: expires_at
                  remarks: "上架时固定的失效时间；部分成交和重连不刷新期限。"
                  type: timestamp with time zone
                  constraints: { nullable: false }
        - createIndex:
            tableName: market_listing
            indexName: market_listing_seller_state
            columns:
              - column: { name: seller_account_id }
              - column: { name: state }
        - createIndex:
            tableName: market_listing
            indexName: market_listing_expiry
            columns:
              - column: { name: state }
              - column: { name: expires_at }
        - sql:
            sql: |
              ALTER TABLE market_listing ADD CONSTRAINT market_listing_values_check CHECK (
                kind IN ('ITEM', 'CREATURE') AND state IN ('ACTIVE', 'SOLD', 'RETURN_PENDING', 'RETURNED')
                AND unit_price >= 2 AND original_quantity > 0 AND remaining BETWEEN 0 AND original_quantity
                AND expires_at > created_at
                AND (kind <> 'CREATURE' OR original_quantity = 1)
                AND ((state IN ('SOLD', 'RETURNED') AND remaining = 0)
                  OR (state IN ('ACTIVE', 'RETURN_PENDING') AND remaining > 0))
              );
              CREATE UNIQUE INDEX market_listing_asset_in_custody
                ON market_listing(kind, asset_id) WHERE state IN ('ACTIVE', 'RETURN_PENDING');
