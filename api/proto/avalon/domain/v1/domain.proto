// GameSkillVolatileStatus 是技能可施加的封闭易变状态类别。
enum GameSkillVolatileStatus {
  GAME_SKILL_VOLATILE_STATUS_UNSPECIFIED = 0;
  GAME_SKILL_VOLATILE_STATUS_CONFUSION = 1;
  GAME_SKILL_VOLATILE_STATUS_BINDING = 2;
  GAME_SKILL_VOLATILE_STATUS_TAUNT = 3;
  GAME_SKILL_VOLATILE_STATUS_CHARGING = 4;
  GAME_SKILL_VOLATILE_STATUS_LOCKED_MOVE = 5;
  GAME_SKILL_VOLATILE_STATUS_DISABLE = 6;
  // PROTECTION 表示使用者在本回合剩余行动中完全阻止对方技能影响自身。
  GAME_SKILL_VOLATILE_STATUS_PROTECTION = 7;
  // SUBSTITUTE 表示使用者支付本体生命建立独立生命值的替身。
  GAME_SKILL_VOLATILE_STATUS_SUBSTITUTE = 8;
}

// GameSkillVolatileTarget 是易变状态相对于技能使用者的明确落点。
enum GameSkillVolatileTarget {
  GAME_SKILL_VOLATILE_TARGET_UNSPECIFIED = 0;
  GAME_SKILL_VOLATILE_TARGET_SELECTED_TARGET = 1;
  GAME_SKILL_VOLATILE_TARGET_USER = 2;
}

// GameSkillVolatileEffect 是技能成功后施加的一项强类型易变状态规则。
message GameSkillVolatileEffect {
  // status 是封闭的易变状态类别。
  GameSkillVolatileStatus status = 1 [(google.api.field_behavior) = REQUIRED];
  // target 是状态相对本次技能使用者的明确落点。
  GameSkillVolatileTarget target = 2 [(google.api.field_behavior) = REQUIRED];
  // chance_percent 是本项状态独立触发概率，取值为 1 至 100。
  int32 chance_percent = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).int32 = {
      gte: 1
      lte: 100
    }
  ];
  // min_turns 是持续时间下界，取值为 1 至 100。
  int32 min_turns = 4 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).int32 = {
      gte: 1
      lte: 100
    }
  ];
  // max_turns 是持续时间上界，取值为 1 至 100 且不得小于 min_turns。
  int32 max_turns = 5 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).int32 = {
      gte: 1
      lte: 100
    }
  ];
  // substitute_cost_numerator 是建立替身时支付使用者最大生命值的分子；只允许 SUBSTITUTE 使用。
  int32 substitute_cost_numerator = 6 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  // substitute_cost_denominator 是建立替身时支付使用者最大生命值的分母；只允许 SUBSTITUTE 使用。
  int32 substitute_cost_denominator = 7 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
}

// GameSkillFieldSpeedOrderKind 是技能可以建立的全场速度顺序效果类别。
enum GameSkillFieldSpeedOrderKind {
  GAME_SKILL_FIELD_SPEED_ORDER_KIND_UNSPECIFIED = 0;
  // TRICK_ROOM 使同一行动优先度内有效速度较低的成员先行动。
  GAME_SKILL_FIELD_SPEED_ORDER_KIND_TRICK_ROOM = 1;
}

// GameSkillFieldSpeedOrder 是技能成功后尝试建立的全场速度顺序效果。
//
// 该消息不是天气、易变状态或侧状态的通用载体。再次成功使用相同 kind 时引擎会解除现有效果，而不是刷新时长。
message GameSkillFieldSpeedOrder {
  // kind 是封闭的全场速度顺序效果种类。
  GameSkillFieldSpeedOrderKind kind = 1 [(google.api.field_behavior) = REQUIRED];
  // turns_remaining 是效果建立时的正持续回合数。
  int32 turns_remaining = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).int32 = {
      gte: 1
      lte: 100
    }
  ];
  // chance_percent 是该效果独立触发概率。
  int32 chance_percent = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).int32 = {
      gte: 1
      lte: 100
    }
  ];
}

// GameSkillLeechSeed 是技能命中后尝试在已选目标本体种下的寄生种子规则。
//
// 来源由引擎记录为使用者当时的场上槽位；目标换下时种子清除，来源换下后由该槽位的新成员在回合末获得回复。
// 它不是易变状态、固定回合持续效果或通用吸血参数，因而使用单独的传输模型。
message GameSkillLeechSeed {
  // chance_percent 是种子写入目标的独立触发概率。
  int32 chance_percent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).int32 = {
      gte: 1
      lte: 100
    }
  ];
}

// GameSkillWeatherKind 是技能能够建立的普通全场天气类别。
enum GameSkillWeatherKind {
  GAME_SKILL_WEATHER_KIND_UNSPECIFIED = 0;
  // SUN 表示日照，强化火属性技能并削弱水属性技能。
  GAME_SKILL_WEATHER_KIND_SUN = 1;
  // RAIN 表示降雨，强化水属性技能并削弱火属性技能。
  GAME_SKILL_WEATHER_KIND_RAIN = 2;
  // SANDSTORM 表示沙暴，在回合末伤害非岩石、地面、钢属性成员。
  GAME_SKILL_WEATHER_KIND_SANDSTORM = 3;
  // SNOW 表示降雪；额外防御加成属于后续独立引擎能力。
  GAME_SKILL_WEATHER_KIND_SNOW = 4;
}

// GameAbilityStrongWeatherKind 是特性能够在入场时建立的封闭强天气类别。
//
// 它与 GameSkillWeatherKind 故意分离：强天气的覆盖、来源与结束条件不同于任何按回合递减的普通天气。
enum GameAbilityStrongWeatherKind {
  GAME_ABILITY_STRONG_WEATHER_KIND_UNSPECIFIED = 0;
