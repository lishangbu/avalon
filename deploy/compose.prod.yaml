services:
  avalon:
    image: registry.example.com/avalon:0.1.0-aot
    command: ["cached"]
    volumes:
      - type: bind
        source: ./application-prod.yaml
        target: /application/config/application-prod.yaml
        read_only: true
        bind:
          create_host_path: false
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_LIQUIBASE_ENABLED: "false"
      TZ: Asia/Shanghai
      LANG: C.UTF-8
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    tmpfs:
      - /tmp:rw,nosuid,size=128m
    restart: unless-stopped
    stop_grace_period: 30s
