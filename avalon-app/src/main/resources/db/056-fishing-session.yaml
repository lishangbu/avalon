databaseChangeLog:
  - changeSet:
      id: 056-fishing-session
      author: avalon
      changes:
        - createTable:
            tableName: fishing_session
            remarks: 服务端权威钓鱼状态及最近一局结果
            columns:
              - column:
                  name: character_id
                  type: bigint
                  remarks: 钓鱼角色
                  constraints:
                    primaryKey: true
                    nullable: false
                    references: player_character(id)
                    foreignKeyName: fishing_session_character_fk
              - column:
                  name: state
                  type: text
                  remarks: 固定步长进度、操作序号、鱼种、鱼竿和终局结果
                  constraints:
                    nullable: false
