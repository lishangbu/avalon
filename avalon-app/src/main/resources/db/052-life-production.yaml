databaseChangeLog:
  - changeSet:
      id: 052-life-production
      author: avalon
      changes:
        - createTable:
            tableName: life_operation_receipt
            remarks: 生活生产操作回执，结果与材料消耗和工具报废原子提交
            columns:
              - column:
                  name: character_id
                  type: bigint
                  remarks: 操作角色
                  constraints:
                    primaryKey: true
                    nullable: false
                    references: player_character(id)
                    foreignKeyName: life_operation_character_fk
              - column:
                  name: request_id
                  type: varchar(36)
                  remarks: 标准UUID请求号
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: payload
                  type: text
                  remarks: 排序后规范化请求内容，防止同请求号更换材料
                  constraints:
                    nullable: false
              - column:
                  name: result
                  type: text
                  remarks: 已提交结果，重试不重新抽取工具报废
                  constraints:
                    nullable: false
